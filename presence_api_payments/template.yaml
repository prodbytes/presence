AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  presence_api_payments (stacks presence-payments and presence-rc-payments):
  the Stripe Payment Links a free member upgrades to Premium with, monthly
  and yearly. GET /api/payments/links answers them to any signed-in user;
  PUT /api/payments/links saves them, for admins only (admin in rbacr's
  presence system, or an rbacr root). Until an admin saves them, the
  deploy's MonthlyLink and YearlyLink. A JWT authorizer checks the Presence
  session token (the auth API's) first. Its own HTTP API, served under /api/payments/* by the site's
  CloudFront distribution. Web payments are Stripe's: rbacr syncs the Stripe
  account's subscriptions into the premium role. App Store and Google Play
  subscriptions (the mobile apps) are verified here, server-side, and
  granted in rbacr (/api/payments/store/*; specs/payments-api.md).

Parameters:
  SessionIssuer:
    Type: String
    Description: >
      The Presence session tokens' issuer (the auth API stack's SessionIssuer
      output: https://<site>, its documents at the site's root; earlier
      https://<site>/api/auth): only its tokens, for the audience presence,
      are accepted. scripts/deploy.sh passes it.
    AllowedPattern: 'https://[A-Za-z0-9.-]+(:[0-9]+)?(/api/auth)?'
  MonthlyLink:
    Type: String
    Default: ''
    Description: >
      The monthly plan's Stripe Payment Link until an admin saves one
      (https://buy.stripe.com/...). Empty: not offered.
    AllowedPattern: '(https://([a-z0-9-]+\.)*stripe\.com(/[A-Za-z0-9._~%-]*)*)?'
  YearlyLink:
    Type: String
    Default: ''
    Description: >
      The yearly plan's Stripe Payment Link until an admin saves one.
      Empty: not offered.
    AllowedPattern: '(https://([a-z0-9-]+\.)*stripe\.com(/[A-Za-z0-9._~%-]*)*)?'
  RbacrUrl:
    Type: String
    Default: https://rbacr.nu01.com
    AllowedPattern: 'https://[A-Za-z0-9.-]+(:[0-9]+)?'
    Description: >
      rbacr's origin, asked whether the caller of PUT /api/payments/links is
      an admin (the same rbacr as the auth API).
  RbacrToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      An rbacr API token that may ask about anyone's roles (the auth API's).
      Empty: nobody is an admin, so nobody can change the links. Set at
      deploy (scripts/deploy.sh), never in the repository.
  RbacrSystem:
    Type: String
    Default: presence
    AllowedPattern: '[a-z0-9][a-z0-9_.:-]{0,62}'
    Description: The rbacr system the app's roles are in.
  RbacrGrantToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      An rbacr API token owned by an rbacr root (only roots may grant):
      store purchases grant and revoke the presence system's premium role
      with it. Empty: store purchases are off (the verify route answers
      503). Set at deploy (RBACR_GRANT_TOKEN), never in the repository.
  GooglePlaySecretName:
    Type: String
    Default: ''
    AllowedPattern: '((presence|presence-rc)/[A-Za-z0-9/_+=.@-]{1,200})?'
    Description: >
      The Secrets Manager secret (name) holding the Google Cloud service
      account's JSON key file that may read and acknowledge Presence's
      Google Play subscriptions, under the stage's prefix (presence/... or
      presence-rc/...), which the permissions boundary allows. Empty:
      Google Play purchases are off.
  StoreAllowSandbox:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      true: App Store sandbox purchases (TestFlight, App Review) and Google
      Play test purchases (license testers) count, which cost nothing. The
      RC's default; GA's only while a build is in App Review.
  OriginSecret:
    Type: String
    NoEcho: true
    Default: ''
    AllowedPattern: '[A-Za-z0-9_-]*'
    Description: >
      The secret the site's CloudFront adds to every request it sends this
      API (the x-presence-origin-verify header; specs/origin-check.md):
      requests without it get 403. Passed by scripts/deploy.sh once the
      site sends it; empty (locally, or before): every request passes.
  PermissionsBoundary:
    Type: String
    Default: ''
    Description: >
      The permissions boundary of the function's role (the stage's
      <prefix>-app-boundary from presence_infra/github-deploy.yaml; passed
      by scripts/deploy.sh, which the deploy roles require).
    AllowedPattern: '(arn:aws[a-z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+)?'
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: The Lambda's CPU (arm64 in AWS).

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundary, '']]
  HasGooglePlay: !Not [!Equals [!Ref GooglePlaySecretName, '']]

Resources:
  # Payments' settings and store purchases, by "id": "links" {"monthly",
  # "yearly" (Stripe Payment Links, or empty), "updatedAt" (epoch ms),
  # "updatedBy" (the admin's email)}; "account:<email>" {"accountToken",
  # "purchases", "grantedUntil"}; "purchase:ios:<originalTransactionId>"
  # and "purchase:android:<sha256 of the token>" {"email", "productId",
  # "expiresAt", "revoked", "updatedAt"}. Holds emails: AWS only.
  PaymentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  PaymentsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      RouteSettings:
        # The app asks it when a free member's account sheet loads.
        "GET /api/payments/links":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        # Admins only, by hand.
        "PUT /api/payments/links":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        # The mobile apps, at sign-in.
        "GET /api/payments/store":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        # Each purchase, restore and daily re-check calls the store and rbacr.
        "POST /api/payments/store/verify":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 5
        # Apple's server, unauthenticated by JWT (its signature checks it).
        "POST /api/payments/store/apple-notifications":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 5
      Auth:
        DefaultAuthorizer: PresenceSession
        Authorizers:
          # Rejects missing, expired, forged or foreign tokens with 401
          # before the function runs: Presence session tokens only.
          PresenceSession:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Ref SessionIssuer
              audience:
                - presence

  # PaymentsFunction's logs, kept 30 days. A new name (no random suffix), not the
  # /aws/lambda/<function name> group Lambda made on its own, which
  # exists already (a LogGroup of that name would fail to create).
  PaymentsFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-PaymentsFunction
      RetentionInDays: 30

  PaymentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Its own log group, kept 30 days (PaymentsFunctionLogs).
      LoggingConfig:
        LogGroup: !Ref PaymentsFunctionLogs
      CodeUri: PaymentsFunction
      Handler: presence.payments.PaymentsHandler::handleRequest
      Runtime: java25
      Architectures:
        - !Ref Architecture
      MemorySize: 512
      Timeout: 10
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue]
      Environment:
        Variables:
          ORIGIN_SECRET: !Ref OriginSecret
          PAYMENTS_TABLE: !Ref PaymentsTable
          MONTHLY_LINK: !Ref MonthlyLink
          YEARLY_LINK: !Ref YearlyLink
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          RBACR_GRANT_TOKEN: !Ref RbacrGrantToken
          GOOGLE_PLAY_SECRET: !Ref GooglePlaySecretName
          STORE_ALLOW_SANDBOX: !Ref StoreAllowSandbox
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PaymentsTable.Arn
            # The Google Play service account's key file: that secret only
            # (its ARN ends in a random 6-character suffix).
            - !If
              - HasGooglePlay
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${GooglePlaySecretName}-??????
              - !Ref AWS::NoValue
      Events:
        GetLinks:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaymentsHttpApi
            Path: /api/payments/links
            Method: get
        PutLinks:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaymentsHttpApi
            Path: /api/payments/links
            Method: put
        GetStore:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaymentsHttpApi
            Path: /api/payments/store
            Method: get
        VerifyStorePurchase:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaymentsHttpApi
            Path: /api/payments/store/verify
            Method: post
        AppleNotifications:
          Type: HttpApi
          Properties:
            ApiId: !Ref PaymentsHttpApi
            Path: /api/payments/store/apple-notifications
            Method: post
            # Apple sends no token: the function verifies Apple's signature.
            Auth:
              Authorizer: NONE

Outputs:
  ApiDomain:
    Description: The payments HTTP API's host name (the site distribution's /api/payments/* origin)
    Value: !Sub "${PaymentsHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
