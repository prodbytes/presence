version = 0.1

[default.global.parameters]
stack_name = "presence-ingest"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
# No resolve_s3: scripts/deploy.sh passes each stage's own artifact bucket
# (--s3-bucket <prefix>-sam-artifacts-<account>).
