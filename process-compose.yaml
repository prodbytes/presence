version: "0.5"

processes:
  0-health-check:
    command: bash scripts/health-check.sh
    environment:
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-15}
      - SAM_API_PORT=${SAM_API_PORT:-3000}
      - FLOCI_PORT=${FLOCI_PORT:-4566}
      - PRESENCE_CDN_ALIAS=${PRESENCE_CDN_ALIAS:-presence.localhost}
      - PRESENCE_PUBLIC_HOST=${PRESENCE_PUBLIC_HOST:-local.presence.nu01.com}
      - INDEX_PORT=${INDEX_PORT:-8081}
      - FLOCI_HTTPS_PORT=${FLOCI_HTTPS_PORT:-8443}
    # Start logging once every service passes its readiness probe, so the
    # first status line reflects a fully started stack.
    depends_on:
      2-flutter-web:
        condition: process_healthy
      3-sam-api:
        condition: process_healthy
      4-floci:
        condition: process_healthy
      5-index:
        condition: process_healthy
    availability:
      restart: on_failure
      backoff_seconds: 5

  2-flutter-web:
    command: bash scripts/flutter-web.sh
    environment:
      - FLUTTER_WEB_PORT=${FLUTTER_WEB_PORT:-8080}
    readiness_probe:
      http_get:
        host: localhost
        port: ${FLUTTER_WEB_PORT:-8080}
        path: /app/
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      failure_threshold: 150
    availability:
      restart: on_failure
      backoff_seconds: 5

  3-sam-api:
    command: bash scripts/sam-api.sh
    environment:
      - SAM_API_PORT=${SAM_API_PORT:-3000}
    shutdown:
      signal: 2
      timeout_seconds: 30
    readiness_probe:
      http_get:
        host: localhost
        port: ${SAM_API_PORT:-3000}
        path: /api/events
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 10
      failure_threshold: 150
    availability:
      restart: on_failure
      backoff_seconds: 5

  4-floci:
    # The mkcert certificate is generated first, when missing or stale.
    command: bash scripts/local-certs.sh && docker compose -f presence_floci/compose.yaml up floci
    environment:
      - FLOCI_HTTPS_PORT=${FLOCI_HTTPS_PORT:-8443}
    shutdown:
      command: docker compose -f presence_floci/compose.yaml down
      timeout_seconds: 30
    readiness_probe:
      exec:
        command: curl -fs http://localhost:${FLOCI_PORT:-4566}/_floci/init | grep -q '"ready":true'
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 5
      failure_threshold: 60
    availability:
      restart: on_failure
      backoff_seconds: 5

  5-index:
    # The site root (presence_index/site), which redirects to /app/. Floci's
    # distribution uses it as the default origin.
    command: python3 -m http.server ${INDEX_PORT:-8081} --bind 127.0.0.1 --directory presence_index/site
    readiness_probe:
      http_get:
        host: localhost
        port: ${INDEX_PORT:-8081}
        path: /
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 5
      failure_threshold: 30
    availability:
      restart: on_failure
      backoff_seconds: 5
