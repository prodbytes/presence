version: "0.5"

processes:
  0-health-check:
    command: bash scripts/health-check.sh
    environment:
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-15}
      - FLOCI_PORT=${FLOCI_PORT:-4566}
      - PRESENCE_CDN_ALIAS=${PRESENCE_CDN_ALIAS:-presence.localhost}
      - PRESENCE_PUBLIC_HOST=${PRESENCE_PUBLIC_HOST:-local.presence.nu01.com}
      - INDEX_PORT=${INDEX_PORT:-8081}
      - FLOCI_HTTPS_PORT=${FLOCI_HTTPS_PORT:-8443}
    # Start logging once every service passes its readiness probe, so the
    # first status line reflects a fully started stack.
    depends_on:
      2-flutter-web:
        condition: process_healthy
      4-floci:
        condition: process_healthy
      5-index:
        condition: process_healthy
    availability:
      restart: on_failure
      backoff_seconds: 5

  2-flutter-web:
    command: bash scripts/flutter-web.sh
    environment:
      - FLUTTER_WEB_PORT=${FLUTTER_WEB_PORT:-8080}
    # Stopping only the script leaves flutter's dart process serving the
    # old build on the port, and the next start then fails to bind it. Stop
    # whatever listens on the port (flutter's wrapper exits with it).
    shutdown:
      command: lsof -tiTCP:${FLUTTER_WEB_PORT:-8080} -sTCP:LISTEN | xargs kill 2>/dev/null; true
      timeout_seconds: 10
    readiness_probe:
      http_get:
        host: localhost
        port: ${FLUTTER_WEB_PORT:-8080}
        path: /app/
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 5
      failure_threshold: 150
    availability:
      restart: on_failure
      backoff_seconds: 5

  4-floci:
    # The mkcert certificate is generated first, when missing or stale.
    # So is the auth API build, which Floci deploys (05-auth-api.sh), with
    # GOOGLE_WEB_CLIENT_ID from .env for its JWT authorizer, and cloud
    # sync's pool and bucket for its health report.
    command: bash scripts/local-certs.sh && bash scripts/build-auth-api.sh && GOOGLE_WEB_CLIENT_ID="$(sed -n 's/^GOOGLE_WEB_CLIENT_ID=//p' .env 2>/dev/null | tail -1)" COGNITO_IDENTITY_POOL_ID="$(sed -n 's/^COGNITO_IDENTITY_POOL_ID=//p' .env 2>/dev/null | tail -1)" USER_DATA_BUCKET="$(sed -n 's/^USER_DATA_BUCKET=//p' .env 2>/dev/null | tail -1)" docker compose -f presence_floci/compose.yaml up floci
    environment:
      - FLOCI_HTTPS_PORT=${FLOCI_HTTPS_PORT:-8443}
    shutdown:
      # Also removes the auth API's Lambda containers, which Floci starts
      # beside itself.
      command: docker compose -f presence_floci/compose.yaml down; docker ps -aq --filter label=io.floci.service=lambda --filter name=presence-lambda | xargs docker rm -f >/dev/null 2>&1; true
      timeout_seconds: 30
    readiness_probe:
      exec:
        command: curl -fs http://localhost:${FLOCI_PORT:-4566}/_floci/init | grep -q '"ready":true'
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 5
      # Up to 6 minutes: the first run builds the auth API and pulls the
      # Lambda image.
      failure_threshold: 180
    availability:
      restart: on_failure
      backoff_seconds: 5

  5-index:
    # The site root (presence_index/site), which redirects to /app/. Floci's
    # distribution uses it as the default origin.
    # PRESENCE_BIND_HOST: see scripts/flutter-web.sh.
    command: python3 -m http.server ${INDEX_PORT:-8081} --bind ${PRESENCE_BIND_HOST:-127.0.0.1} --directory presence_index/site
    readiness_probe:
      http_get:
        host: localhost
        port: ${INDEX_PORT:-8081}
        path: /
      initial_delay_seconds: 1
      period_seconds: 2
      timeout_seconds: 5
      failure_threshold: 30
    availability:
      restart: on_failure
      backoff_seconds: 5
