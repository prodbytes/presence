version: "0.5"

processes:
  0-health-check:
    command: bash scripts/health-check.sh
    environment:
      - HEALTH_CHECK_INTERVAL=${HEALTH_CHECK_INTERVAL:-15}
      - SAM_API_PORT=${SAM_API_PORT:-3000}
    availability:
      restart: on_failure
      backoff_seconds: 5

  1-postgresql:
    command: docker compose up postgres
    shutdown:
      command: docker stop devbox-db
      timeout_seconds: 30
    readiness_probe:
      exec:
        command: docker exec devbox-db pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}
      initial_delay_seconds: 3
      period_seconds: 3
      timeout_seconds: 5
      failure_threshold: 20
    availability:
      restart: on_failure
      backoff_seconds: 5

  2-flutter-web:
    command: bash scripts/flutter-web.sh
    environment:
      - FLUTTER_WEB_PORT=${FLUTTER_WEB_PORT:-8080}
    readiness_probe:
      http_get:
        host: localhost
        port: ${FLUTTER_WEB_PORT:-8080}
        path: /
      initial_delay_seconds: 10
      period_seconds: 5
      timeout_seconds: 5
      failure_threshold: 60
    availability:
      restart: on_failure
      backoff_seconds: 5

  3-sam-api:
    command: bash scripts/sam-api.sh
    environment:
      - SAM_API_PORT=${SAM_API_PORT:-3000}
    shutdown:
      signal: 2
      timeout_seconds: 30
    readiness_probe:
      http_get:
        host: localhost
        port: ${SAM_API_PORT:-3000}
        path: /events
      initial_delay_seconds: 15
      period_seconds: 5
      timeout_seconds: 10
      failure_threshold: 60
    availability:
      restart: on_failure
      backoff_seconds: 5
