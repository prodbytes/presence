# Floci: a local AWS emulator. Here it plays CloudFront, routing /app/ to the
# Flutter dev server, /api/* to the auth API and everything else to the
# index, as the deployed stack would. The auth API itself (Lambda, HTTP API,
# DynamoDB) is deployed into Floci too (init/ready.d/05-auth-api.sh).
# Started by `devbox services up` (4-floci in process-compose.yaml).
services:
  floci:
    # The compat image has the AWS CLI, which the init hook uses. A dated
    # nightly: 2.1.0 forwards no viewer headers to custom origins. Move to the
    # next release once it ships. Pinned by digest (the multi-arch index;
    # `docker buildx imagetools inspect floci/floci:<tag>` shows it), so a
    # re-pushed tag can't change what runs here with the Docker socket.
    image: floci/floci:nightly-09242026-compat@sha256:eb725a12cd80bbbcb476a33c0a1d98382a54d5c9f39c4c31b160f7cdf9cf1a6e
    container_name: presence-floci
    ports:
      - "127.0.0.1:${FLOCI_PORT:-4566}:4566"
      # HTTPS with the mkcert certificate (4566 also answers HTTPS)
      - "127.0.0.1:${FLOCI_HTTPS_PORT:-8443}:8443"
    extra_hosts:
      # The origin host (see init/ready.d/10-cloudfront.sh): the Docker host
      # in here, loopback in the browser.
      - "${PRESENCE_ORIGIN_HOST:-dev.presence.localhost}:host-gateway"
    environment:
      # Stateless: the ready hook recreates the distribution on every start.
      FLOCI_STORAGE_MODE: memory
      # Local HTTPS: the certificate from scripts/local-certs.sh (mkcert),
      # served on 8443 as well as 4566. 8443 instead of the default 443
      # avoids binding a privileged port.
      FLOCI_TLS_ENABLED: "true"
      FLOCI_TLS_CERT_PATH: /etc/presence-certs/presence.pem
      FLOCI_TLS_KEY_PATH: /etc/presence-certs/presence-key.pem
      FLOCI_TLS_AWS_HTTPS_PORT: "8443"
      # CloudFront refuses private origins unless they're listed here: the
      # dev servers, and the local auth API (its fixed ID from 05-auth-api.sh).
      FLOCI_SERVICES_CLOUDFRONT_ALLOWED_PRIVATE_ORIGIN_HOSTS: ${PRESENCE_ORIGIN_HOST:-dev.presence.localhost},presence.execute-api.localhost.floci.io
      PRESENCE_ORIGIN_HOST: ${PRESENCE_ORIGIN_HOST:-dev.presence.localhost}
      PRESENCE_CDN_ALIAS: ${PRESENCE_CDN_ALIAS:-presence.localhost}
      PRESENCE_PUBLIC_HOST: ${PRESENCE_PUBLIC_HOST:-local.presence.nu01.com}
      FLUTTER_WEB_PORT: ${FLUTTER_WEB_PORT:-8080}
      INDEX_PORT: ${INDEX_PORT:-8081}
      # The auth API's JWT authorizer only accepts ID tokens for this client
      # (from the private .env; a public identifier, not a secret).
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      # Cloud sync's pool and bucket: the auth API only reports whether
      # they're set (the app's health line).
      COGNITO_IDENTITY_POOL_ID: ${COGNITO_IDENTITY_POOL_ID:-}
      USER_DATA_BUCKET: ${USER_DATA_BUCKET:-}
      # The auth API's root allowlist (empty: the template's defaults).
      PRESENCE_ROOT_DOMAINS: ${PRESENCE_ROOT_DOMAINS:-}
      PRESENCE_ROOT_EMAILS: ${PRESENCE_ROOT_EMAILS:-}
      # Lambda containers are named presence-lambda-*, so shutdown can find
      # them (process-compose.yaml).
      FLOCI_SERVICES_LAMBDA_CONTAINER_NAME_PREFIX: presence-lambda
      # 05-auth-api.sh deploys a stack, which takes longer than the default 30 s.
      FLOCI_INIT_HOOKS_TIMEOUT_SECONDS: "180"
    volumes:
      - ./init/ready.d:/etc/floci/init/ready.d:ro
      - ./certs:/etc/presence-certs:ro
      # The auth API build (scripts/build-auth-api.sh), deployed by the hook.
      - ../presence_api_auth/.aws-sam/build:/opt/presence-auth-api:ro
      # Floci runs Lambda functions as sibling Docker containers. This gives
      # the container control of the Docker daemon: local development only
      # (Floci's ports are bound to 127.0.0.1).
      - /var/run/docker.sock:/var/run/docker.sock
