AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  presence_api_auth (stacks presence-auth-api and presence-rc-auth-api):
  GET /api/auth/profile returns the signed-in user's profile (found by the
  token's subject, or made at the first sign-in), the roles a linked
  account shares from the profile's owner (only presence_user and
  presence_premium) and its accounts; /api/auth/credentials and
  /api/auth/profile/* give a profile's cloud credentials and link its
  accounts. A JWT authorizer checks the Google ID token first. GET
  /api/auth/anonymous (no token) returns the execution mode and which
  settings are set. Every role comes from rbacr (its presence system:
  free, premium, admin; its roots get all): the app asks rbacr directly
  for the user's own roles, maintenance mode and vouchers, which admins
  manage in rbacr. GET /health is presence_health, which imports the
  tables' exports. Served under /api/* by CloudFront.
  (CloudFormation caps this description at 1024 characters.)

Parameters:
  GoogleWebClientId:
    Type: String
    Default: ''
    Description: >
      The Google web OAuth client; ID tokens must be issued for it (their aud).
      Empty only for local development (Floci): the API then runs in DEV mode,
      where the anonymous user gets every role. scripts/deploy.sh requires it.
    AllowedPattern: '([0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com)?'
  GoogleDeviceClientId:
    Type: String
    Default: ''
    Description: >
      The Google OAuth client presence-streamer signs in with (a "TVs and
      Limited Input devices" client, for Google's device flow); its ID tokens
      are accepted too. Empty: only the web client's.
    AllowedPattern: '([0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com)?'
  IdentityPoolId:
    Type: String
    Default: ''
    Description: >
      The Cognito identity pool cloud sync uses (presence-identity's
      IdentityPoolId). Only reported as set or not, for the app's health line.
  UserDataBucket:
    Type: String
    Default: ''
    Description: >
      The bucket cloud sync uploads to (presence-user-data's
      UserDataBucketName). Only reported as set or not, for the app's health line.
  IotPolicyName:
    Type: String
    Default: ''
    Description: >
      Live sync's AWS IoT policy (presence-identity's LivePolicyName), which
      POST /api/auth/credentials attaches to each profile's Cognito identity
      (AWS IoT requires one for authenticated identities). Empty: live sync
      is off, and nothing is attached.
    AllowedPattern: '[A-Za-z0-9_+=,.@-]*'
  PermissionsBoundary:
    Type: String
    Default: ''
    Description: >
      The permissions boundary every function role gets (the stage's
      <prefix>-app-boundary from presence_infra/github-deploy.yaml; passed by
      scripts/deploy.sh, which the deploy roles require). Empty locally (Floci).
    AllowedPattern: '(arn:aws[a-z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+)?'
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: >
      The Lambdas' CPU. arm64 in AWS; the local Floci deploy passes the
      host's, so they run without emulation (x86_64 on GitHub Codespaces).
  RbacrUrl:
    Type: String
    Default: https://rbacr.nu01.com
    Description: >
      RBACR_URL: rbacr (github.com/prodbytes/rbacr), which keeps every
      role: who may use the app (free), sync with the cloud (premium),
      administer it (admin) or is a root (rbacr's root list). Subscriptions
      (at nu01.com) and vouchers grant there; the app asks it directly too.
  RbacrToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      RBACR_TOKEN: an rbacr API token owned by an rbacr root, which may ask
      about anyone's roles (a linked account shares its profile owner's).
      Empty: nobody has a role (and
      presence_health's rbacr check fails). Set it at deploy (scripts/deploy.sh, from the
      RBACR_TOKEN secret), never in the repository.
  LocalCloud:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: >
      LOCAL_CLOUD: 'true' only in the local stack (presence_floci's init),
      whose Floci has no Cognito Identity: identities are made up from the
      Google subject and the credentials route answers fake credentials
      itself (presence.auth.LocalCloudBackend). Never in AWS: scripts/deploy.sh
      leaves it 'false'.
  RbacrSystem:
    Type: String
    Default: presence
    AllowedPattern: '[a-z0-9][a-z0-9_.:-]{0,62}'
    Description: >
      RBACR_SYSTEM: the rbacr system the app's roles are in.

Conditions:
  HasGoogleClient: !Not [!Equals [!Ref GoogleWebClientId, '']]
  HasDeviceClient: !And
    - !Condition HasGoogleClient
    - !Not [!Equals [!Ref GoogleDeviceClientId, '']]
  HasIdentityPool: !Not [!Equals [!Ref IdentityPoolId, '']]
  HasUserDataBucket: !Not [!Equals [!Ref UserDataBucket, '']]
  HasIotPolicy: !Not [!Equals [!Ref IotPolicyName, '']]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundary, '']]

Globals:
  Function:
    Runtime: java25
    Architectures:
      - !Ref Architecture
    MemorySize: 512
    Timeout: 10
    PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue]

Resources:
  # Profiles: whose data it is, outliving the ways its owner signs in.
  # {"id": "<adjective>_<adjective>_<animal>", "createdAt", "lastSignInAt"
  # (epoch ms), "ownerSubject", "ownerEmail", "identityId" (its Cognito
  # identity: its folder in the user-data bucket)}.
  ProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Which profile each authenticated subject signs in to:
  # {"subject": "<iss>#<sub>", "profileId", "email", "linkedAt"}, indexed by
  # profile. Several subjects may share a profile (linked with a code).
  # Holds emails: AWS only.
  ProfileSubjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subject
          AttributeType: S
        - AttributeName: profileId
          AttributeType: S
      KeySchema:
        - AttributeName: subject
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: profile
          KeySchema:
            - AttributeName: profileId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # One-time link codes, by their SHA-256: {"code", "profileId",
  # "createdBy", "expiresAt" (epoch s, the TTL)}.
  LinkCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # Cloud recognition, per profile ("profile", the profile ID): its labels
  # ("item" label#<id>: name, kind, labeledAt (epoch ms), vector: the crop's
  # DINOv2 embedding, 1024 float32s; never the crop) and its model ("item"
  # model: trainedAt (epoch ms), labels, subjects [{name, kind, labels, bias,
  # weights}]). Learned again from the labels at any time, so no backups.
  RecognitionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: profile
          AttributeType: S
        - AttributeName: item
          AttributeType: S
      KeySchema:
        - AttributeName: profile
          KeyType: HASH
        - AttributeName: item
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  AuthHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      RouteSettings:
        # The app asks it at every sign-in, and it writes a profile at the first.
        "GET /api/auth/profile":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        # Public (no token): the app asks it at every start. These limits
        # are per route, for all callers together: a flood from one address
        # uses them up and every app start waits (429) until it stops. Only
        # a per-IP rate rule (AWS WAF on the CloudFront distribution) would
        # isolate it; see specs/auth-api.md.
        "GET /api/auth/anonymous":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        # Link codes: slow enough that guessing one (40 bits) is hopeless.
        "POST /api/auth/profile/link-code":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /api/auth/profile/link":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        # Cloud recognition: each request runs DINOv2 on up to 8 crops
        # (a few seconds of a 3 GB function), so these cap the cost.
        "POST /api/recognition/labels":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 2
        "POST /api/recognition/train":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /api/recognition/identify":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 5
        # Breeds and coats: SigLIP2 on up to 8 crops (well under a second).
        "POST /api/recognition/describe":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 5
      Auth:
        DefaultAuthorizer: GoogleIdToken
        Authorizers:
          # Rejects missing, expired, forged or foreign tokens with 401
          # before the function runs.
          GoogleIdToken:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: https://accounts.google.com
              # Without a client (DEV), no token can match: only the
              # anonymous route answers. presence-streamer's device sign-in
              # client is accepted too, when there is one.
              audience: !If
                - HasDeviceClient
                - [!Ref GoogleWebClientId, !Ref GoogleDeviceClientId]
                - [!If [HasGoogleClient, !Ref GoogleWebClientId, no-oidc-client]]

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.AuthHandler::handleRequest
      Environment:
        Variables:
          # Decides the ExecutionMode: DEV when empty, else RBAC.
          GOOGLE_WEB_CLIENT_ID: !Ref GoogleWebClientId
          # GET /api/auth/anonymous says whether these are set (Settings),
          # never their values.
          COGNITO_IDENTITY_POOL_ID: !Ref IdentityPoolId
          USER_DATA_BUCKET: !Ref UserDataBucket
          RBACR_TOKEN: !Ref RbacrToken
      Events:
        # The execution mode and the anonymous user's roles, without a token.
        Anonymous:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/anonymous
            Method: get
            Auth:
              Authorizer: NONE

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.ProfileHandler::handleRequest
      Environment:
        Variables:
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          LINK_CODES_TABLE: !Ref LinkCodesTable
          COGNITO_IDENTITY_POOL_ID: !Ref IdentityPoolId
          USER_DATA_BUCKET: !Ref UserDataBucket
          # The identity pool's DeveloperProviderName (presence_infra/identity.yaml).
          DEVELOPER_PROVIDER: login.presence.profiles
          # Live sync's IoT policy, attached to each identity (empty: off).
          IOT_POLICY_NAME: !Ref IotPolicyName
          # The local stack only: no Cognito Identity (LocalCloudBackend).
          LOCAL_CLOUD: !Ref LocalCloud
      Policies:
        - Statement:
            # Links, moves and unlinks subjects; lists a profile's.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt ProfileSubjectsTable.Arn
                - !Sub "${ProfileSubjectsTable.Arn}/index/profile"
            # Makes profiles, records sign-ins, sets the identity once.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProfilesTable.Arn
            # Saves codes; reads one to check a link before using it up
            # (a conditional delete).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt LinkCodesTable.Arn
            # Finds an account's existing identity (GetId) and issues the
            # profile's tokens. Only this pool ("none" when it isn't set).
            - Effect: Allow
              Action:
                - cognito-identity:GetId
                - cognito-identity:GetOpenIdTokenForDeveloperIdentity
              Resource: !Sub
                - "arn:${AWS::Partition}:cognito-identity:${AWS::Region}:${AWS::AccountId}:identitypool/${Pool}"
                - Pool: !If [HasIdentityPool, !Ref IdentityPoolId, none]
            # Only to see whether an account's folder is empty before linking it.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
            # Live sync: attaches the IoT policy to the caller's identity.
            # AttachPolicy can only be scoped to certificates and thing
            # groups, not to a Cognito identity target or a policy, so it's
            # any resource; the function only ever attaches IotPolicyName.
            # Without one, a certificate that doesn't exist ("none").
            - Effect: Allow
              Action: iot:AttachPolicy
              Resource: !If
                - HasIotPolicy
                - '*'
                - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:cert/none"
      Events:
        Credentials:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/credentials
            Method: post
        # The profile (made at the first sign-in), what it shares and its accounts.
        Profile:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile
            Method: get
        LinkCode:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/link-code
            Method: post
        Link:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/link
            Method: post
        Unlink:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/unlink
            Method: post
        RemoveDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/devices/remove
            Method: post

  # Cloud recognition (premium only; specs/cloud-recognition.md): DINOv2-L
  # through ONNX Runtime, in its own jar (RecognitionFunction, built by the
  # Makefile), so the functions above don't carry it. The model (1.2 GB) is
  # fetched at an instance's first use into /tmp, from the bucket's models/
  # prefix, or else from Hugging Face (then kept there). An API request
  # gives up after 30 s; the function goes on (Timeout), so a first fetch
  # still finishes and the next request finds the model.
  RecognitionTrainFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: presence.auth.TrainingHandler::handleRequest
      MemorySize: 3008
      Timeout: 120
      EphemeralStorage:
        Size: 3072
      Environment:
        Variables:
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          RECOGNITION_TABLE: !Ref RecognitionTable
          MODEL_BUCKET: !Ref UserDataBucket
      Policies:
        - Statement:
            # The caller's profile (made at a first sign-in, as GET /api/auth).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ProfileSubjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProfilesTable.Arn
            # The profile's labels and model.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource: !GetAtt RecognitionTable.Arn
            # The model's file, kept in the bucket (only under models/).
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}/models/*"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
      Events:
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/recognition/status
            Method: get
        Labels:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/recognition/labels
            Method: post
        Train:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/recognition/train
            Method: post

  RecognitionInferFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: presence.auth.InferenceHandler::handleRequest
      MemorySize: 3008
      Timeout: 120
      EphemeralStorage:
        Size: 3072
      Environment:
        Variables:
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          RECOGNITION_TABLE: !Ref RecognitionTable
          MODEL_BUCKET: !Ref UserDataBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ProfileSubjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProfilesTable.Arn
            # Reads the profile's model only.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt RecognitionTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}/models/*"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
      Events:
        Identify:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/recognition/identify
            Method: post

  # Cloud recognition's breeds and coats (premium only): SigLIP2's image
  # tower (int8, 95 MB, fetched as DINOv2 is) against the labels' text
  # embeddings (pet-labels.bin). Its own function, so neither it nor
  # identify waits for the other's model; it keeps nothing.
  RecognitionDescribeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: presence.auth.DescribeHandler::handleRequest
      MemorySize: 2048
      Timeout: 60
      Environment:
        Variables:
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          MODEL_BUCKET: !Ref UserDataBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ProfileSubjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProfilesTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}/models/*"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
      Events:
        Describe:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/recognition/describe
            Method: post

Outputs:
  # The tables' exports (<stack>-<Table>): presence_health imports them to
  # check the tables (DescribeTable). While it does, CloudFormation refuses
  # to change or remove them: scripts/deploy.sh deploys an existing health
  # stack first, so it stops importing one before this stack drops it, and
  # a new export ships in a deploy before the one that imports it.
  ApiDomain:
    Description: The HTTP API's host name (the site distribution's /api/* origin)
    Value: !Sub "${AuthHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ProfilesTableName:
    Description: Profiles (id -> createdAt, lastSignInAt)
    Value: !Ref ProfilesTable
    Export:
      Name: !Sub ${AWS::StackName}-ProfilesTable
  ProfileSubjectsTableName:
    Description: Which profile each subject signs in to (iss#sub -> profileId)
    Value: !Ref ProfileSubjectsTable
    Export:
      Name: !Sub ${AWS::StackName}-ProfileSubjectsTable
  LinkCodesTableName:
    Description: One-time link codes (sha256(code) -> profileId, expiresAt)
    Value: !Ref LinkCodesTable
    Export:
      Name: !Sub ${AWS::StackName}-LinkCodesTable
  RecognitionTableName:
    Description: Cloud recognition (profile, label#<id> or model -> embeddings, weights)
    Value: !Ref RecognitionTable
