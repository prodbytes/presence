AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  presence_api_auth (stack presence-auth-api, and presence-rc-auth-api for the release
  candidate): GET /api/auth returns the signed-in user's roles, POST
  /api/auth/membership lets a user without them ask for access, and the
  Admin screen's routes (presence_admin only) list and approve those
  requests. API
  Gateway's HTTP API checks the Google ID token (JWT authorizer) before the
  functions run; they read the verified claims. Nobody has roles, except
  verified emails at one of AllowedDomains (DomainRoles) and users listed in
  the UserRoles table (email -> roles). Served under /api/* by the site's
  CloudFront distribution (presence_infra/site.yaml).

Parameters:
  GoogleWebClientId:
    Type: String
    Description: The Google web OAuth client; ID tokens must be issued for it (their aud)
    AllowedPattern: '[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com'
  AllowedDomains:
    Type: String
    Default: nu01.com
    Description: Comma-separated email domains whose verified users get DomainRoles
  DomainRoles:
    Type: String
    Default: presence_user,presence_admin
    Description: >
      Comma-separated roles for AllowedDomains users. presence_user uses the
      app; presence_admin also approves membership requests.

Globals:
  Function:
    Runtime: java25
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 10

Resources:
  # Roles declared per user, by email: {"email": "<lowercase>", "roles": SS or L}.
  # Its contents live only here, never in the repository.
  UserRolesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Membership requests, one per user: {"email", "name", "message",
  # "requestedAt" (epoch ms), "dismissed"?}. Like UserRoles, it holds people's emails: AWS only.
  MembershipTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Each membership request is published here. Administrators subscribe by
  # hand (e.g. by email), so no address is kept in the repository.
  MembershipTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Presence membership
      KmsMasterKeyId: alias/aws/sns

  AuthHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Anyone with a Google account can post membership requests: keep it slow.
      RouteSettings:
        "POST /api/auth/membership":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
      Auth:
        DefaultAuthorizer: GoogleIdToken
        Authorizers:
          # Rejects missing, expired, forged or foreign tokens with 401
          # before the function runs.
          GoogleIdToken:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: https://accounts.google.com
              audience:
                - !Ref GoogleWebClientId

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.AuthHandler::handleRequest
      Environment:
        Variables:
          USER_ROLES_TABLE: !Ref UserRolesTable
          ALLOWED_DOMAINS: !Ref AllowedDomains
          DOMAIN_ROLES: !Ref DomainRoles
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserRolesTable
      Events:
        Roles:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth
            Method: get

  MembershipFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.MembershipHandler::handleRequest
      Environment:
        Variables:
          MEMBERSHIP_TABLE: !Ref MembershipTable
          MEMBERSHIP_TOPIC_ARN: !Ref MembershipTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt MembershipTable.Arn
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt MembershipTopic.TopicName
      Events:
        Request:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/membership
            Method: post

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.AdminHandler::handleRequest
      Environment:
        Variables:
          USER_ROLES_TABLE: !Ref UserRolesTable
          ALLOWED_DOMAINS: !Ref AllowedDomains
          DOMAIN_ROLES: !Ref DomainRoles
          MEMBERSHIP_TABLE: !Ref MembershipTable
      Policies:
        - Statement:
            # Checks the caller's roles and grants presence_user.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UserRolesTable.Arn
            # Lists, dismisses (a flag) and, after a grant, removes requests.
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt MembershipTable.Arn
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/membership
            Method: get
        Grant:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/membership/grant
            Method: post
        Dismiss:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/membership/dismiss
            Method: post

Outputs:
  ApiDomain:
    Description: The HTTP API's host name (the site distribution's /api/* origin)
    Value: !Sub "${AuthHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserRolesTableName:
    Description: Where roles are declared per user (email -> roles)
    Value: !Ref UserRolesTable
  MembershipTableName:
    Description: Membership requests (email -> message, requestedAt)
    Value: !Ref MembershipTable
  MembershipTopicArn:
    Description: Subscribe administrators here to hear about membership requests
    Value: !Ref MembershipTopic
