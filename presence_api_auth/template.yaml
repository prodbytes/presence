AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  presence_api_auth (stacks presence-auth-api and presence-rc-auth-api):
  GET /api/auth returns the signed-in user's profile (found by the token's
  subject, or made at the first sign-in) and roles; POST /api/auth/voucher
  redeems a voucher code; the Admin routes (presence_admin) manage vouchers
  and maintenance mode; /api/auth/credentials and /api/auth/profile/* give a
  profile's cloud credentials and link its accounts. A JWT authorizer
  checks the Google ID token first. GET /api/auth/anonymous (no token)
  returns the execution mode and which settings are set; GET /health (no
  token) checks the dependencies. Every role comes from rbacr (its
  presence system: free, premium, admin; its roots get all; users
  subscribe at nu01.com), and vouchers grant there. A linked account
  shares only its owner's presence_user and presence_premium. Served under
  /api/* by CloudFront.
  (CloudFormation caps this description at 1024 characters.)

Parameters:
  Version:
    Type: String
    Default: ''
    Description: >
      The release deployed (X.Y.Z, from scripts/deploy.sh), reported by
      GET /health as "version". Empty locally: /health then leaves it out.
    AllowedPattern: '([0-9]+\.[0-9]+\.[0-9]+)?'
  GoogleWebClientId:
    Type: String
    Default: ''
    Description: >
      The Google web OAuth client; ID tokens must be issued for it (their aud).
      Empty only for local development (Floci): the API then runs in DEV mode,
      where the anonymous user gets every role. scripts/deploy.sh requires it.
    AllowedPattern: '([0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com)?'
  IdentityPoolId:
    Type: String
    Default: ''
    Description: >
      The Cognito identity pool cloud sync uses (presence-identity's
      IdentityPoolId). Only reported as set or not, for the app's health line.
  UserDataBucket:
    Type: String
    Default: ''
    Description: >
      The bucket cloud sync uploads to (presence-user-data's
      UserDataBucketName). Only reported as set or not, for the app's health line.
  IotPolicyName:
    Type: String
    Default: ''
    Description: >
      Live sync's AWS IoT policy (presence-identity's LivePolicyName), which
      POST /api/auth/credentials attaches to each profile's Cognito identity
      (AWS IoT requires one for authenticated identities). Empty: live sync
      is off, and nothing is attached.
    AllowedPattern: '[A-Za-z0-9_+=,.@-]*'
  PermissionsBoundary:
    Type: String
    Default: ''
    Description: >
      The permissions boundary every function role gets (the stage's
      <prefix>-app-boundary from presence_infra/github-deploy.yaml; passed by
      scripts/deploy.sh, which the deploy roles require). Empty locally (Floci).
    AllowedPattern: '(arn:aws[a-z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+)?'
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: >
      The Lambdas' CPU. arm64 in AWS; the local Floci deploy passes the
      host's, so they run without emulation (x86_64 on GitHub Codespaces).
  RbacrUrl:
    Type: String
    Default: https://rbacr.nu01.com
    Description: >
      RBACR_URL: rbacr (github.com/prodbytes/rbacr), which keeps every
      role: who may use the app (free), sync with the cloud (premium),
      administer it (admin) or is a root (rbacr's root list). Subscriptions
      (at nu01.com) and vouchers grant there.
  RbacrToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      RBACR_TOKEN: an rbacr API token owned by an rbacr root, which may ask
      about anyone's roles and grant them. Empty: nobody has a role, and
      /health fails. Set it at deploy (scripts/deploy.sh, from the
      RBACR_TOKEN secret), never in the repository.
  RbacrSystem:
    Type: String
    Default: presence
    AllowedPattern: '[a-z0-9][a-z0-9_.:-]{0,62}'
    Description: >
      RBACR_SYSTEM: the rbacr system the app's roles are in.

Conditions:
  HasGoogleClient: !Not [!Equals [!Ref GoogleWebClientId, '']]
  HasIdentityPool: !Not [!Equals [!Ref IdentityPoolId, '']]
  HasUserDataBucket: !Not [!Equals [!Ref UserDataBucket, '']]
  HasIotPolicy: !Not [!Equals [!Ref IotPolicyName, '']]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundary, '']]
  HasRbacr: !Not [!Equals [!Ref RbacrToken, '']]

Globals:
  Function:
    Runtime: java25
    Architectures:
      - !Ref Architecture
    MemorySize: 512
    Timeout: 10
    PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue]

Resources:
  # Per user, by email: {"email": "<lowercase>", "voucherMisses",
  # "voucherMissesSince"} (the voucher lockout). Its "roles" (SS or L) are
  # what roles were before rbacr, copied there by
  # scripts/migrate-roles-to-rbacr.sh and no longer read.
  # Its contents live only here, never in the repository.
  UserRolesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Profiles: whose data it is, outliving the ways its owner signs in.
  # {"id": "<adjective>_<adjective>_<animal>", "createdAt", "lastSignInAt"
  # (epoch ms), "ownerSubject", "ownerEmail", "identityId" (its Cognito
  # identity: its folder in the user-data bucket)}.
  ProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Which profile each authenticated subject signs in to:
  # {"subject": "<iss>#<sub>", "profileId", "email", "linkedAt"}, indexed by
  # profile. Several subjects may share a profile (linked with a code).
  # Holds emails: AWS only.
  ProfileSubjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subject
          AttributeType: S
        - AttributeName: profileId
          AttributeType: S
      KeySchema:
        - AttributeName: subject
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: profile
          KeySchema:
            - AttributeName: profileId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Voucher codes: {"code": "XXXX-XXXX-XXXX" or chosen ("AUTUMN-OTTER-4821"),
  # "role", "expiresAt" (epoch ms), "maxUses", "uses", "redeemedBy" (SS of
  # emails), "createdBy", "createdAt" (epoch ms), "discount" (percent)}. Holds emails and live codes: AWS only.
  VoucherTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # One-time link codes, by their SHA-256: {"code", "profileId",
  # "createdBy", "expiresAt" (epoch s, the TTL)}.
  LinkCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # The system's own state, one item per setting: {"id": "maintenance",
  # "on", "message", "since" (epoch ms), "by" (the admin's email)}.
  SystemTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  AuthHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      RouteSettings:
        # Slows down guessing codes (random ones have 60 bits; chosen ones at
        # least 10 letters and digits), with VoucherHandler's per-email
        # lockout (10 wrong codes an hour).
        "POST /api/auth/voucher":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        # Writes a profile at a first sign-in; the app asks it once per sign-in.
        "GET /api/auth":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        # Public (no token): the app asks it at every start. These limits
        # are per route, for all callers together: a flood from one address
        # uses them up and every app start waits (429) until it stops. Only
        # a per-IP rate rule (AWS WAF on the CloudFront distribution) would
        # isolate it; see specs/auth-api.md.
        "GET /api/auth/anonymous":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        # Public (no token): Route 53's health checkers, from several
        # regions every 30 s. Answers are reused for 20 s (HealthHandler).
        "GET /health":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        # Link codes: slow enough that guessing one (40 bits) is hopeless.
        "POST /api/auth/profile/link-code":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /api/auth/profile/link":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
      Auth:
        DefaultAuthorizer: GoogleIdToken
        Authorizers:
          # Rejects missing, expired, forged or foreign tokens with 401
          # before the function runs.
          GoogleIdToken:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: https://accounts.google.com
              # Without a client (DEV), no token can match: only the
              # anonymous route answers.
              audience:
                - !If [HasGoogleClient, !Ref GoogleWebClientId, no-oidc-client]

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.AuthHandler::handleRequest
      Environment:
        Variables:
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          # rbacr gives every role (Roles).
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          # Decides the ExecutionMode: DEV when empty, else RBAC.
          GOOGLE_WEB_CLIENT_ID: !Ref GoogleWebClientId
          # GET /api/auth/anonymous says whether these are set (Settings).
          COGNITO_IDENTITY_POOL_ID: !Ref IdentityPoolId
          USER_DATA_BUCKET: !Ref UserDataBucket
          # GET /api/auth/anonymous says whether maintenance mode is on.
          SYSTEM_TABLE: !Ref SystemTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SystemTable.Arn
            # Finds the subject's profile, or links it to a new one.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ProfileSubjectsTable.Arn
            # Creates profiles (with an unused ID), records each sign-in
            # and reads the owner, whose membership a linked subject shares.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProfilesTable.Arn
      Events:
        Roles:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth
            Method: get
        # The execution mode and the anonymous user's roles, without a token.
        Anonymous:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/anonymous
            Method: get
            Auth:
              Authorizer: NONE

  VoucherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.VoucherHandler::handleRequest
      Environment:
        Variables:
          VOUCHER_TABLE: !Ref VoucherTable
          USER_ROLES_TABLE: !Ref UserRolesTable
          # Grants the voucher's role in rbacr.
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
      Policies:
        - Statement:
            # Counts a use (one conditional update), or gives it back if the
            # grant fails; reads a refused code to tell a partial discount (402).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt VoucherTable.Arn
            # Counts the email's wrong codes (the lockout).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UserRolesTable.Arn
      Events:
        Redeem:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/voucher
            Method: post

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.AdminHandler::handleRequest
      Environment:
        Variables:
          # Checks the caller's roles in rbacr.
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          VOUCHER_TABLE: !Ref VoucherTable
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          SYSTEM_TABLE: !Ref SystemTable
      Policies:
        - Statement:
            # The caller's profile owner, whose membership a linked subject shares.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource:
                - !GetAtt ProfileSubjectsTable.Arn
                - !GetAtt ProfilesTable.Arn
            # Creates (only new codes), lists and deletes vouchers (a
            # presence_admin one only for a root: a conditional delete).
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Scan
                - dynamodb:DeleteItem
              Resource: !GetAtt VoucherTable.Arn
            # Reads and switches maintenance mode.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt SystemTable.Arn
      Events:
        ListVouchers:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/vouchers
            Method: get
        CreateVoucher:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/vouchers
            Method: post
        DeleteVoucher:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/vouchers/delete
            Method: post
        GetMaintenance:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/maintenance
            Method: get
        SetMaintenance:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/maintenance
            Method: post

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.ProfileHandler::handleRequest
      Environment:
        Variables:
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          LINK_CODES_TABLE: !Ref LinkCodesTable
          COGNITO_IDENTITY_POOL_ID: !Ref IdentityPoolId
          USER_DATA_BUCKET: !Ref UserDataBucket
          # The identity pool's DeveloperProviderName (presence_infra/identity.yaml).
          DEVELOPER_PROVIDER: login.presence.profiles
          # Live sync's IoT policy, attached to each identity (empty: off).
          IOT_POLICY_NAME: !Ref IotPolicyName
      Policies:
        - Statement:
            # Links, moves and unlinks subjects; lists a profile's.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt ProfileSubjectsTable.Arn
                - !Sub "${ProfileSubjectsTable.Arn}/index/profile"
            # Makes profiles, records sign-ins, sets the identity once.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProfilesTable.Arn
            # Saves codes; reads one to check a link before using it up
            # (a conditional delete).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt LinkCodesTable.Arn
            # Finds an account's existing identity (GetId) and issues the
            # profile's tokens. Only this pool ("none" when it isn't set).
            - Effect: Allow
              Action:
                - cognito-identity:GetId
                - cognito-identity:GetOpenIdTokenForDeveloperIdentity
              Resource: !Sub
                - "arn:${AWS::Partition}:cognito-identity:${AWS::Region}:${AWS::AccountId}:identitypool/${Pool}"
                - Pool: !If [HasIdentityPool, !Ref IdentityPoolId, none]
            # Only to see whether an account's folder is empty before linking it.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
            # Live sync: attaches the IoT policy to the caller's identity.
            # AttachPolicy can only be scoped to certificates and thing
            # groups, not to a Cognito identity target or a policy, so it's
            # any resource; the function only ever attaches IotPolicyName.
            # Without one, a certificate that doesn't exist ("none").
            - Effect: Allow
              Action: iot:AttachPolicy
              Resource: !If
                - HasIotPolicy
                - '*'
                - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:cert/none"
      Events:
        Credentials:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/credentials
            Method: post
        Profile:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile
            Method: get
        LinkCode:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/link-code
            Method: post
        Link:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/link
            Method: post
        Unlink:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/unlink
            Method: post
        RemoveDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/devices/remove
            Method: post

  # GET /health: whether every dependency answers (presence.auth.HealthHandler),
  # polled by the site's Route 53 health check. Read-only: it only
  # describes the tables, heads the bucket and describes the pool.
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.HealthHandler::handleRequest
      # More memory, more CPU: a cold start must still answer Route 53 in time.
      MemorySize: 1024
      Environment:
        Variables:
          PRESENCE_VERSION: !Ref Version
          RBACR_URL: !If [HasRbacr, !Ref RbacrUrl, '']
          GOOGLE_WEB_CLIENT_ID: !Ref GoogleWebClientId
          COGNITO_IDENTITY_POOL_ID: !Ref IdentityPoolId
          USER_DATA_BUCKET: !Ref UserDataBucket
          HEALTH_TABLES: !Join
            - ','
            - - !Ref UserRolesTable
              - !Ref ProfilesTable
              - !Ref ProfileSubjectsTable
              - !Ref VoucherTable
              - !Ref LinkCodesTable
              - !Ref SystemTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:DescribeTable
              Resource:
                - !GetAtt UserRolesTable.Arn
                - !GetAtt ProfilesTable.Arn
                - !GetAtt ProfileSubjectsTable.Arn
                - !GetAtt VoucherTable.Arn
                - !GetAtt LinkCodesTable.Arn
                - !GetAtt SystemTable.Arn
            # HeadBucket needs ListBucket; the bucket only ("none" when unset).
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
            - Effect: Allow
              Action: cognito-identity:DescribeIdentityPool
              Resource: !Sub
                - "arn:${AWS::Partition}:cognito-identity:${AWS::Region}:${AWS::AccountId}:identitypool/${Pool}"
                - Pool: !If [HasIdentityPool, !Ref IdentityPoolId, none]
      Events:
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /health
            Method: get
            Auth:
              Authorizer: NONE

Outputs:
  ApiDomain:
    Description: The HTTP API's host name (the site distribution's /api/* origin)
    Value: !Sub "${AuthHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserRolesTableName:
    Description: The voucher lockout per user (email -> voucherMisses); its old roles are rbacr's now
    Value: !Ref UserRolesTable
  ProfilesTableName:
    Description: Profiles (id -> createdAt, lastSignInAt)
    Value: !Ref ProfilesTable
  ProfileSubjectsTableName:
    Description: Which profile each subject signs in to (iss#sub -> profileId)
    Value: !Ref ProfileSubjectsTable
  VoucherTableName:
    Description: Voucher codes (code -> role, expiresAt, maxUses, uses)
    Value: !Ref VoucherTable
  SystemTableName:
    Description: The system's state (maintenance -> on, message, since, by)
    Value: !Ref SystemTable
