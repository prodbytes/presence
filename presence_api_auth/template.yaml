AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  presence_api_auth (stacks presence-auth-api and presence-rc-auth-api):
  GET /api/auth/profile returns the signed-in user's profile (found by the
  token's subject, or made at the first sign-in), the roles a linked
  account shares from the profile's owner (only presence_user and
  presence_premium) and its accounts; /api/auth/credentials and
  /api/auth/profile/* give a profile's cloud credentials and link its
  accounts. /api/auth/session trades a Google or Apple ID token for a
  Presence session (a KMS-signed JWT and a refresh token); a JWT
  authorizer checks that token on every other route. GET
  /api/auth/anonymous (no token) returns the execution mode and settings.
  Every role comes from rbacr: the app asks it directly. GET /health is
  presence_health, which imports the tables' exports. Served under /api/*
  by CloudFront.
  (CloudFormation caps this description at 1024 characters.)

Parameters:
  GoogleWebClientId:
    Type: String
    Default: ''
    Description: >
      The Google web OAuth client; ID tokens must be issued for it (their aud).
      Empty only for local development (Floci): the API then runs in DEV mode,
      where the anonymous user gets every role. scripts/deploy.sh requires it.
    AllowedPattern: '([0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com)?'
  GoogleDeviceClientId:
    Type: String
    Default: ''
    Description: >
      The Google OAuth client presence-streamer signs in with (a "TVs and
      Limited Input devices" client, for Google's device flow); its ID tokens
      are exchanged for sessions too. Empty: only the web client's.
    AllowedPattern: '([0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com)?'
  DomainName:
    Type: String
    Default: ''
    Description: >
      The site's host (presence.nu01.com, rc.presence.nu01.com): the session
      tokens' issuer is https://<it>, whose /.well-known/openid-configuration
      and jwks.json are static files on the site (scripts/deploy.sh copies
      them from this API's /api/auth/.well-known/*), where API Gateway's JWT
      authorizers (this API's and the payments API's) and rbacr fetch them.
      Not this API itself: API Gateway fetches them while it imports this
      API, when its own routes can't answer. scripts/deploy.sh passes it.
    AllowedPattern: '([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)*[a-z0-9]([a-z0-9-]*[a-z0-9])?|'
  SessionIssuer:
    Type: String
    Default: ''
    Description: >
      Overrides the issuer (https://<DomainName>). Only the local
      stack sets it (presence_floci: the local HTTP API on Floci's loopback
      address, which its JWT authorizer can reach). Empty: from DomainName.
    AllowedPattern: '(https?://[A-Za-z0-9.:-]+(/[A-Za-z0-9._/$-]*)?)?'
  SessionAuthorizer:
    Type: String
    Default: 'on'
    AllowedValues: ['on', bootstrap]
    Description: >
      on: the APIs' authorizer takes Presence session tokens. bootstrap: it
      takes Google ID tokens instead, for the first deploy only. API Gateway
      fetches the issuer's /.well-known/openid-configuration when it imports
      the API, and silently drops an authorizer it can't fetch, with every
      route behind it; the document is copied to the site from this API, so
      it can't be the authorizer's issuer until this API is up.
      scripts/deploy.sh deploys with bootstrap while the site doesn't serve
      the document yet, copies it there, then deploys with on.
  SigningKeyArn:
    Type: String
    Default: ''
    Description: >
      An existing KMS key (RSA_2048, SIGN_VERIFY) to sign session tokens with,
      instead of the stack's own (SessionSigningKey). Only the local stack sets
      it: Floci's CloudFormation makes symmetric keys whatever the KeySpec, so
      presence_floci makes the key with the KMS API. Empty in AWS.
    AllowedPattern: '(arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[0-9a-f-]+)?'
  AppleClientIds:
    Type: String
    Default: com.nu01.presence
    Description: >
      Sign in with Apple: the clients (the iOS app's bundle ID, comma-separated)
      whose Apple ID tokens are exchanged for sessions (their aud). Empty: no
      Apple sign-in.
    AllowedPattern: '[A-Za-z0-9.,-]*'
  AppleTeamId:
    Type: String
    Default: ''
    Description: >
      Sign in with Apple's key, to revoke a user's Apple tokens when their
      account is deleted (Apple requires it): the Apple Developer team ID.
      With AppleKeyId and AppleKeyParameter; any empty: no revocation.
    AllowedPattern: '([A-Z0-9]{10})?'
  AppleKeyId:
    Type: String
    Default: ''
    Description: The ID of the Sign in with Apple key (a .p8 from Apple Developer, Keys).
    AllowedPattern: '([A-Z0-9]{10})?'
  AppleKeyParameter:
    Type: String
    Default: ''
    Description: >
      The SSM SecureString parameter holding the Sign in with Apple key (the
      .p8 file's PEM), put there by an administrator, never in the repository
      or a template, under the stage's prefix (the permissions boundary allows
      only /<prefix>/*): /presence/apple-signin-key, /presence-rc/apple-signin-key.
      Only its name is passed; the session function reads it
      (ssm:GetParameter on it alone).
    AllowedPattern: '(/[A-Za-z0-9_.-]+)*'
  IdentityPoolId:
    Type: String
    Default: ''
    Description: >
      The Cognito identity pool cloud sync uses (presence-identity's
      IdentityPoolId). Only reported as set or not, for the app's health line.
  UserDataBucket:
    Type: String
    Default: ''
    Description: >
      The bucket cloud sync uploads to (presence-user-data's
      UserDataBucketName). Only reported as set or not, for the app's health line.
  FeedbackTable:
    Type: String
    Default: ''
    Description: >
      Feedback and Help's table (presence-user-data's FeedbackTableName),
      keyed by the profile's identity: POST /api/auth/account/delete deletes
      the profile's conversation (or a linked account's own messages).
      Empty: there's none to delete from.
    AllowedPattern: '[A-Za-z0-9_.-]*'
  IotPolicyName:
    Type: String
    Default: ''
    Description: >
      Live sync's AWS IoT policy (presence-identity's LivePolicyName), which
      POST /api/auth/credentials attaches to each profile's Cognito identity
      (AWS IoT requires one for authenticated identities). Empty: live sync
      is off, and nothing is attached.
    AllowedPattern: '[A-Za-z0-9_+=,.@-]*'
  OriginSecret:
    Type: String
    NoEcho: true
    Default: ''
    AllowedPattern: '[A-Za-z0-9_-]*'
    Description: >
      The secret the site's CloudFront adds to every request it sends this
      API (the x-presence-origin-verify header; specs/origin-check.md):
      requests without it get 403. Passed by scripts/deploy.sh once the
      site sends it; empty (locally, or before): every request passes.
  PermissionsBoundary:
    Type: String
    Default: ''
    Description: >
      The permissions boundary every function role gets (the stage's
      <prefix>-app-boundary from presence_infra/github-deploy.yaml; passed by
      scripts/deploy.sh, which the deploy roles require). Empty locally (Floci).
    AllowedPattern: '(arn:aws[a-z-]*:iam::[0-9]{12}:policy/[A-Za-z0-9+=,.@_/-]+)?'
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: >
      The Lambdas' CPU. arm64 in AWS; the local Floci deploy passes the
      host's, so they run without emulation (x86_64 on GitHub Codespaces).
  RbacrUrl:
    Type: String
    Default: https://rbacr.nu01.com
    Description: >
      RBACR_URL: rbacr (github.com/prodbytes/rbacr), which keeps every
      role: who may use the app (free), sync with the cloud (premium),
      administer it (admin) or is a root (rbacr's root list). Subscriptions
      (at nu01.com) and vouchers grant there; the app asks it directly too.
  RbacrToken:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      RBACR_TOKEN: an rbacr API token owned by an rbacr root, which may ask
      about anyone's roles (a linked account shares its profile owner's).
      Empty: nobody has a role (and
      presence_health's rbacr check fails). Set it at deploy (scripts/deploy.sh, from the
      RBACR_TOKEN secret), never in the repository.
  LocalCloud:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: >
      LOCAL_CLOUD: 'true' only in the local stack (presence_floci's init),
      whose Floci has no Cognito Identity: identities are made up from the
      Google subject and the credentials route answers fake credentials
      itself (presence.auth.LocalCloudBackend). Never in AWS: scripts/deploy.sh
      leaves it 'false'.
  RbacrSystem:
    Type: String
    Default: presence
    AllowedPattern: '[a-z0-9][a-z0-9_.:-]{0,62}'
    Description: >
      RBACR_SYSTEM: the rbacr system the app's roles are in.
  Stage:
    Type: String
    Default: prod
    AllowedValues: [prod, rc]
    Description: >
      The stage (scripts/deploy.sh's STAGE). Only prod keeps recognition's
      models warm (WarmUp): the RC stage has little traffic.

Conditions:
  HasGoogleClient: !Not [!Equals [!Ref GoogleWebClientId, '']]
  HasDeviceClient: !And
    - !Condition HasGoogleClient
    - !Not [!Equals [!Ref GoogleDeviceClientId, '']]
  HasSessionIssuer: !Not [!Equals [!Ref SessionIssuer, '']]
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  BootstrapAuthorizer: !Equals [!Ref SessionAuthorizer, bootstrap]
  CreateSigningKey: !Equals [!Ref SigningKeyArn, '']
  HasAppleKey: !And
    - !Not [!Equals [!Ref AppleTeamId, '']]
    - !Not [!Equals [!Ref AppleKeyId, '']]
    - !Not [!Equals [!Ref AppleKeyParameter, '']]
  HasIdentityPool: !Not [!Equals [!Ref IdentityPoolId, '']]
  HasUserDataBucket: !Not [!Equals [!Ref UserDataBucket, '']]
  HasIotPolicy: !Not [!Equals [!Ref IotPolicyName, '']]
  HasFeedbackTable: !Not [!Equals [!Ref FeedbackTable, '']]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundary, '']]
  # Recognition's warm-ups (infer and describe) run in prod only, never in
  # the RC stage or the local stack (specs/cloud-recognition.md, "Warm-up").
  WarmUp: !And
    - !Equals [!Ref Stage, prod]
    - !Equals [!Ref LocalCloud, 'false']

Globals:
  Function:
    Runtime: java25
    Architectures:
      - !Ref Architecture
    MemorySize: 512
    Timeout: 10
    PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundary, !Ref AWS::NoValue]
    # Every function refuses requests that didn't come through the site
    # (OriginCheck); merged with each function's own variables.
    Environment:
      Variables:
        ORIGIN_SECRET: !Ref OriginSecret

Resources:
  # Profiles: whose data it is, outliving the ways its owner signs in.
  # {"id": "<adjective>_<adjective>_<animal>", "createdAt", "lastSignInAt"
  # (epoch ms), "ownerSubject", "ownerEmail", "identityId" (its Cognito
  # identity: its folder in the user-data bucket)}.
  ProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Which profile each authenticated subject signs in to:
  # {"subject": "<iss>#<sub>", "profileId", "email", "linkedAt"}, indexed by
  # profile. Several subjects may share a profile (linked with a code).
  # Holds emails: AWS only.
  ProfileSubjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subject
          AttributeType: S
        - AttributeName: profileId
          AttributeType: S
      KeySchema:
        - AttributeName: subject
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: profile
          KeySchema:
            - AttributeName: profileId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # One-time link codes, by their SHA-256: {"code", "profileId",
  # "createdBy", "expiresAt" (epoch s, the TTL)}.
  LinkCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # Streamers' keys, one per device: {"device": "<profile ID>/<device ID>",
  # "hash" (the key's SHA-256, never the key), "createdBy" (email),
  # "subject" (Google sub), "createdAt"}. Holds emails: AWS only.
  StreamKeysTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: device
          AttributeType: S
      KeySchema:
        - AttributeName: device
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Cloud recognition, per profile ("profile", the profile ID): its labels
  # ("item" label#<id>: name, kind, labeledAt (epoch ms), vector: the crop's
  # DINOv2 embedding, 1024 float32s; never the crop) and its model ("item"
  # model: trainedAt (epoch ms), labels, subjects [{name, kind, labels, bias,
  # weights}]). Learned again from the labels at any time, so no backups.
  RecognitionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: profile
          AttributeType: S
        - AttributeName: item
          AttributeType: S
      KeySchema:
        - AttributeName: profile
          KeyType: HASH
        - AttributeName: item
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # Presence sessions' refresh tokens and their families
  # (presence.auth.DynamoSessions): "t#<SHA-256 of the token>" -> {family,
  # idp, idpSub, email, name, picture, hd, used, expiresAt}, and
  # "f#<family>" -> {familySubject (<idp>#<sub>, indexed for account
  # deletion), revoked, expiresAt}. expiresAt (epoch s) is the TTL: 60 days
  # after a token's last use. Holds emails: AWS only. Not kept on stack
  # deletion (losing it signs everyone out, nothing more).
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: familySubject
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: subject
          KeySchema:
            - AttributeName: familySubject
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  # What's kept of a provider identity beyond its sessions
  # (presence.auth.Identities): {"subject": "<idp>#<sub>", "name" (Apple's,
  # given only at the first sign-in), "appleClientId", "appleRefreshToken"
  # (KMS-encrypted with SessionDataKey, for revocation at account
  # deletion), "updatedAt"}. Kept on stack deletion.
  IdentitiesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subject
          AttributeType: S
      KeySchema:
        - AttributeName: subject
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Signs Presence session tokens (RS256). The private key never leaves
  # KMS. The key policy keeps administration with the account (IAM, as for
  # any key), and lets only this stack's roles that IAM also allows (the
  # session function's) sign with it or read its public key. Asymmetric
  # keys don't rotate automatically: see specs/sessions.md for rotating it.
  SessionSigningKey:
    Type: AWS::KMS::Key
    Condition: CreateSigningKey
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub Signs Presence session tokens (${AWS::StackName})
      KeySpec: RSA_2048
      KeyUsage: SIGN_VERIFY
      Tags:
        - Key: presence:stack
          Value: !Ref AWS::StackName
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Administration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: SignSessions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Sign
              - kms:GetPublicKey
            Resource: '*'
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*

  # Encrypts Apple's refresh tokens (IdentitiesTable), with the identity as
  # encryption context. Only with Apple's key configured.
  SessionDataKey:
    Type: AWS::KMS::Key
    Condition: HasAppleKey
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub Encrypts Sign in with Apple refresh tokens (${AWS::StackName})
      # Not rotated: each yearly rotation adds $1/month to the key (for the
      # first two), and a symmetric key that only seals refresh tokens gains
      # nothing from it. Changing this updates the key in place (no
      # replacement), and KMS keeps every key material it ever had, so
      # tokens sealed before still open.
      EnableKeyRotation: false
      Tags:
        - Key: presence:stack
          Value: !Ref AWS::StackName
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Administration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          # The session function seals them; account deletion (the profile
          # function) opens them to revoke them. IAM says which does which.
          - Sid: SealAppleTokens
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - kms:Encrypt
              - kms:Decrypt
            Resource: '*'
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-*

  AuthHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      RouteSettings:
        # The app asks it at every sign-in, and it writes a profile at the first.
        "GET /api/auth/profile":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        # Public (no token): the app asks it at every start. These limits
        # are per route, for all callers together: a flood from one address
        # uses them up and every app start waits (429) until it stops. Only
        # a per-IP rate rule (AWS WAF on the CloudFront distribution) would
        # isolate it; see specs/auth-api.md.
        "GET /api/auth/anonymous":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        # Link codes: slow enough that guessing one (40 bits) is hopeless.
        "POST /api/auth/profile/link-code":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /api/auth/profile/link":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        # The streamer's credentials, hourly per Pi, with no Google token
        # (a 256-bit key is the proof, so slowing guesses is a bonus).
        "POST /api/auth/stream/credentials":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 2
        "POST /api/auth/profile/stream-key":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        # Streamers' leadership: every 5 minutes per streamer, leading or
        # waiting.
        "POST /api/auth/stream/lease":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 2
        # Account deletion: rare, and each request deletes up to 20 s of
        # the profile's folder.
        "POST /api/auth/account/delete":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        # Cloud recognition: each request runs DINOv2 on up to 8 crops
        # (a few seconds of a 3 GB function), so these cap the cost.
        "POST /api/recognition/labels":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 2
        "POST /api/recognition/train":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /api/recognition/identify":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 5
        # Breeds and coats: SigLIP2 on up to 8 crops (well under a second).
        "POST /api/recognition/describe":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 5
        # Sessions (public: each request carries its own proof). A sign-in
        # verifies the provider's token and writes; a refresh is hourly per
        # signed-in device; the documents are fetched by the authorizers
        # and rbacr, which cache them.
        "POST /api/auth/session":
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
        "POST /api/auth/session/refresh":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        "POST /api/auth/session/revoke":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5
        "GET /api/auth/.well-known/openid-configuration":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        "GET /api/auth/.well-known/jwks.json":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
      Auth:
        DefaultAuthorizer: PresenceSession
        Authorizers:
          # Presence session tokens only (POST /api/auth/session makes them):
          # missing, expired, forged or foreign tokens get 401 before the
          # function runs. API Gateway finds the keys at the issuer's
          # /.well-known/openid-configuration, through the site. With
          # SessionAuthorizer=bootstrap (a first deploy, before that document
          # is served), Google ID tokens instead: see the parameter.
          PresenceSession:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !If
                - BootstrapAuthorizer
                - https://accounts.google.com
                - !If
                  - HasSessionIssuer
                  - !Ref SessionIssuer
                  - !If [HasDomain, !Sub "https://${DomainName}", https://no-session-issuer.invalid]
              audience: !If
                - BootstrapAuthorizer
                - [!Ref GoogleWebClientId]
                - [presence]

  # AuthFunction's logs, kept 30 days. A new name (no random suffix), not the
  # /aws/lambda/<function name> group Lambda made on its own, which
  # exists already (a LogGroup of that name would fail to create).
  AuthFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-AuthFunction
      RetentionInDays: 30

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Its own log group, kept 30 days (AuthFunctionLogs).
      LoggingConfig:
        LogGroup: !Ref AuthFunctionLogs
      CodeUri: AuthFunction
      Handler: presence.auth.AuthHandler::handleRequest
      Environment:
        Variables:
          # Decides the ExecutionMode: DEV when empty, else RBAC.
          GOOGLE_WEB_CLIENT_ID: !Ref GoogleWebClientId
          # GET /api/auth/anonymous says whether these are set (Settings),
          # never their values.
          COGNITO_IDENTITY_POOL_ID: !Ref IdentityPoolId
          USER_DATA_BUCKET: !Ref UserDataBucket
          RBACR_TOKEN: !Ref RbacrToken
      Events:
        # The execution mode and the anonymous user's roles, without a token.
        Anonymous:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/anonymous
            Method: get
            Auth:
              Authorizer: NONE

  # SessionFunction's logs, kept 30 days. A new name (no random suffix), not the
  # /aws/lambda/<function name> group Lambda made on its own, which
  # exists already (a LogGroup of that name would fail to create).
  SessionFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-SessionFunction
      RetentionInDays: 30

  # Presence sessions (presence.auth.SessionHandler): the exchange, refresh
  # and revocation, and the issuer's public documents. Public routes: the
  # provider's ID token or the refresh token is the proof.
  SessionFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Its own log group, kept 30 days (SessionFunctionLogs).
      LoggingConfig:
        LogGroup: !Ref SessionFunctionLogs
      CodeUri: AuthFunction
      Handler: presence.auth.SessionHandler::handleRequest
      Environment:
        Variables:
          SESSION_ISSUER: !If
            - HasSessionIssuer
            - !Ref SessionIssuer
            - !If [HasDomain, !Sub "https://${DomainName}", https://no-session-issuer.invalid]
          SIGNING_KEY_ARN: !If [CreateSigningKey, !GetAtt SessionSigningKey.Arn, !Ref SigningKeyArn]
          SESSIONS_TABLE: !Ref SessionsTable
          IDENTITIES_TABLE: !Ref IdentitiesTable
          # Google ID tokens must be for these clients (the web client, which
          # every platform's app asks tokens for, and the streamer's).
          GOOGLE_AUDIENCES: !If
            - HasDeviceClient
            - !Sub "${GoogleWebClientId},${GoogleDeviceClientId}"
            - !Ref GoogleWebClientId
          APPLE_AUDIENCES: !Ref AppleClientIds
          APPLE_TEAM_ID: !If [HasAppleKey, !Ref AppleTeamId, '']
          APPLE_KEY_ID: !If [HasAppleKey, !Ref AppleKeyId, '']
          APPLE_KEY_PARAMETER: !If [HasAppleKey, !Ref AppleKeyParameter, '']
          DATA_KEY_ARN: !If [HasAppleKey, !GetAtt SessionDataKey.Arn, '']
      Policies:
        - Statement:
            # Signs session tokens and publishes the public key; nothing else
            # with the key.
            - Effect: Allow
              Action:
                - kms:Sign
                - kms:GetPublicKey
              Resource: !If [CreateSigningKey, !GetAtt SessionSigningKey.Arn, !Ref SigningKeyArn]
            # Refresh tokens: started, read, rotated (a transaction of
            # updates and a put) and revoked; families found by identity.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt SessionsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${SessionsTable.Arn}/index/subject"
            # Apple's name and refresh token, by identity.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt IdentitiesTable.Arn
            # Sign in with Apple's key (an SSM SecureString, decrypted by
            # SSM with its KMS key) and the data key for Apple's tokens.
            # Without Apple's key: a parameter and key that don't exist.
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub
                - "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${Name}"
                - Name: !If [HasAppleKey, !Ref AppleKeyParameter, /none]
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
              Resource: !If
                - HasAppleKey
                - !GetAtt SessionDataKey.Arn
                - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/none"
      Events:
        Exchange:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/session
            Method: post
            Auth:
              Authorizer: NONE
        Refresh:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/session/refresh
            Method: post
            Auth:
              Authorizer: NONE
        Revoke:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/session/revoke
            Method: post
            Auth:
              Authorizer: NONE
        Discovery:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/.well-known/openid-configuration
            Method: get
            Auth:
              Authorizer: NONE
        Keys:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/.well-known/jwks.json
            Method: get
            Auth:
              Authorizer: NONE

  # ProfileFunction's logs, kept 30 days. A new name (no random suffix), not the
  # /aws/lambda/<function name> group Lambda made on its own, which
  # exists already (a LogGroup of that name would fail to create).
  ProfileFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-ProfileFunction
      RetentionInDays: 30

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      # Its own log group, kept 30 days (ProfileFunctionLogs).
      LoggingConfig:
        LogGroup: !Ref ProfileFunctionLogs
      CodeUri: AuthFunction
      Handler: presence.auth.ProfileHandler::handleRequest
      # Account deletion deletes a profile's folder for up to 20 s a
      # request (then answers 202 and the app asks again), inside the HTTP
      # API's 30 s.
      Timeout: 29
      Environment:
        Variables:
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          LINK_CODES_TABLE: !Ref LinkCodesTable
          STREAM_KEYS_TABLE: !Ref StreamKeysTable
          # Account deletion deletes the profile's labels and model, and its
          # Feedback and Help conversation (empty: none).
          RECOGNITION_TABLE: !Ref RecognitionTable
          FEEDBACK_TABLE: !Ref FeedbackTable
          COGNITO_IDENTITY_POOL_ID: !Ref IdentityPoolId
          USER_DATA_BUCKET: !Ref UserDataBucket
          # The identity pool's DeveloperProviderName (presence_infra/identity.yaml).
          DEVELOPER_PROVIDER: login.presence.profiles
          # Live sync's IoT policy, attached to each identity (empty: off).
          IOT_POLICY_NAME: !Ref IotPolicyName
          # The local stack only: no Cognito Identity (LocalCloudBackend).
          LOCAL_CLOUD: !Ref LocalCloud
          # Account deletion ends the accounts' sign-ins (AccountSessions):
          # their sessions, and Sign in with Apple's tokens at Apple.
          SESSIONS_TABLE: !Ref SessionsTable
          IDENTITIES_TABLE: !Ref IdentitiesTable
          APPLE_TEAM_ID: !If [HasAppleKey, !Ref AppleTeamId, '']
          APPLE_KEY_ID: !If [HasAppleKey, !Ref AppleKeyId, '']
          APPLE_KEY_PARAMETER: !If [HasAppleKey, !Ref AppleKeyParameter, '']
          DATA_KEY_ARN: !If [HasAppleKey, !GetAtt SessionDataKey.Arn, '']
      Policies:
        - Statement:
            # Account deletion: revokes the accounts' session families
            # (found by identity), and forgets their identities after
            # revoking their Apple refresh tokens (read with Apple's key,
            # decrypted with the data key). Without Apple's key: a parameter
            # and key that don't exist.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SessionsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub "${SessionsTable.Arn}/index/subject"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt IdentitiesTable.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub
                - "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${Name}"
                - Name: !If [HasAppleKey, !Ref AppleKeyParameter, /none]
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Effect: Allow
              Action: kms:Decrypt
              Resource: !If
                - HasAppleKey
                - !GetAtt SessionDataKey.Arn
                - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/none"
            # Links, moves and unlinks subjects; lists a profile's.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt ProfileSubjectsTable.Arn
                - !Sub "${ProfileSubjectsTable.Arn}/index/profile"
            # Makes profiles, records sign-ins, sets the identity once;
            # deletes one with its owner's account.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt ProfilesTable.Arn
            # Saves codes; reads one to check a link before using it up
            # (a conditional delete). Scan: a deleted profile's codes
            # (keyed by their hash).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
              Resource: !GetAtt LinkCodesTable.Arn
            # Streamers' keys: saved, checked, revoked with their device.
            # Scan: a deleted profile's (keyed <profile>/<device>).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
              Resource: !GetAtt StreamKeysTable.Arn
            # A deleted profile's cloud recognition labels and model.
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource: !GetAtt RecognitionTable.Arn
            # A deleted account's Feedback and Help messages ("none" when
            # the table isn't set).
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource: !Sub
                - "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Table}"
                - Table: !If [HasFeedbackTable, !Ref FeedbackTable, none]
            # Makes a profile's identity, issues its tokens, and deletes the
            # identity with its owner's account. Only this pool ("none" when
            # it isn't set).
            - Effect: Allow
              Action:
                - cognito-identity:GetOpenIdTokenForDeveloperIdentity
                - cognito-identity:DeleteIdentities
              Resource: !Sub
                - "arn:${AWS::Partition}:cognito-identity:${AWS::Region}:${AWS::AccountId}:identitypool/${Pool}"
                - Pool: !If [HasIdentityPool, !Ref IdentityPoolId, none]
            # To see whether an account's folder is empty before linking it,
            # and to list a deleted profile's folder.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
            # Deletes a deleted profile's folder (DeleteObjects needs
            # DeleteObject on each key). The folder is the profile's
            # identity, known only at run time, so it's any key in the
            # bucket; the function deletes only <identity ID>/ of the
            # caller's own profile (ProfileBackend.IDENTITY_ID).
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}/*"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
            # Live sync: attaches the IoT policy to the caller's identity,
            # and detaches it when the profile is deleted. Neither can be
            # scoped to a Cognito identity target or a policy (only to
            # certificates and thing groups), so it's any resource; the
            # function only ever attaches or detaches IotPolicyName.
            # Without one, a certificate that doesn't exist ("none").
            - Effect: Allow
              Action:
                - iot:AttachPolicy
                - iot:DetachPolicy
              Resource: !If
                - HasIotPolicy
                - '*'
                - !Sub "arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:cert/none"
      Events:
        Credentials:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/credentials
            Method: post
        # The profile (made at the first sign-in), what it shares and its accounts.
        Profile:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile
            Method: get
        LinkCode:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/link-code
            Method: post
        Link:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/link
            Method: post
        Unlink:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/unlink
            Method: post
        RemoveDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/devices/remove
            Method: post
        StreamKey:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/stream-key
            Method: post
        # A streamer signed in with Google: its leadership.
        ProfileStreamLease:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/stream-lease
            Method: post
        # Deletes the caller's account, or its whole profile for the owner.
        DeleteAccount:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/account/delete
            Method: post
        # The streamer's: no session token (no authorizer); its stream key,
        # checked by the function, is the proof.
        StreamCredentials:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/stream/credentials
            Method: post
            Auth:
              Authorizer: NONE
        # Its leadership, with the stream key too.
        StreamLease:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/stream/lease
            Method: post
            Auth:
              Authorizer: NONE

  # RecognitionTrainFunction's logs, kept 30 days. A new name (no random suffix), not the
  # /aws/lambda/<function name> group Lambda made on its own, which
  # exists already (a LogGroup of that name would fail to create).
  RecognitionTrainFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-RecognitionTrainFunction
      RetentionInDays: 30

  # Cloud recognition (premium only; specs/cloud-recognition.md): DINOv2-L
  # through ONNX Runtime, in its own jar (RecognitionFunction, built by the
  # Makefile), so the functions above don't carry it. The model (1.2 GB) is
  # fetched at an instance's first use into /tmp, from the bucket's models/
  # prefix, or else from Hugging Face (then kept there). An API request
  # gives up after 30 s; the function goes on (Timeout), so a first fetch
  # still finishes and the next request finds the model.
  RecognitionTrainFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      # Its own log group, kept 30 days (RecognitionTrainFunctionLogs).
      LoggingConfig:
        LogGroup: !Ref RecognitionTrainFunctionLogs
      CodeUri: .
      Handler: presence.auth.TrainingHandler::handleRequest
      MemorySize: 3008
      Timeout: 120
      EphemeralStorage:
        Size: 3072
      Environment:
        Variables:
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          RECOGNITION_TABLE: !Ref RecognitionTable
          MODEL_BUCKET: !Ref UserDataBucket
      Policies:
        - Statement:
            # The caller's profile (made at a first sign-in, as GET /api/auth).
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ProfileSubjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProfilesTable.Arn
            # The profile's labels and model.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource: !GetAtt RecognitionTable.Arn
            # The model's file, kept in the bucket (only under models/).
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}/models/*"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
      # No warm-up: training runs in the background, so a cold start's
      # model load doesn't matter (specs/cloud-recognition.md, "Warm-up").
      Events:
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/recognition/status
            Method: get
        Labels:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/recognition/labels
            Method: post
        Train:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/recognition/train
            Method: post

  # RecognitionInferFunction's logs, kept 30 days. A new name (no random suffix), not the
  # /aws/lambda/<function name> group Lambda made on its own, which
  # exists already (a LogGroup of that name would fail to create).
  RecognitionInferFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-RecognitionInferFunction
      RetentionInDays: 30

  RecognitionInferFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      # Its own log group, kept 30 days (RecognitionInferFunctionLogs).
      LoggingConfig:
        LogGroup: !Ref RecognitionInferFunctionLogs
      CodeUri: .
      Handler: presence.auth.InferenceHandler::handleRequest
      MemorySize: 3008
      Timeout: 120
      EphemeralStorage:
        Size: 3072
      Environment:
        Variables:
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          RECOGNITION_TABLE: !Ref RecognitionTable
          MODEL_BUCKET: !Ref UserDataBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ProfileSubjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProfilesTable.Arn
            # Reads the profile's model only.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt RecognitionTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}/models/*"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
      Events:
        # Keeps an instance's model loaded (specs/cloud-recognition.md,
        # "Warm-up"): a new one takes over a minute, past the API's 30 s.
        # Prod only (WarmUp): elsewhere the rule exists but stays disabled.
        Warm:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"rawPath": "/warmup"}'
            State: !If [WarmUp, ENABLED, DISABLED]
        Identify:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/recognition/identify
            Method: post

  # RecognitionDescribeFunction's logs, kept 30 days. A new name (no random suffix), not the
  # /aws/lambda/<function name> group Lambda made on its own, which
  # exists already (a LogGroup of that name would fail to create).
  RecognitionDescribeFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-RecognitionDescribeFunction
      RetentionInDays: 30

  # Cloud recognition's breeds and coats (premium only): SigLIP2's image
  # tower (int8, 95 MB, fetched as DINOv2 is) against the labels' text
  # embeddings (pet-labels.bin). Its own function, so neither it nor
  # identify waits for the other's model; it keeps nothing.
  RecognitionDescribeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      # Its own log group, kept 30 days (RecognitionDescribeFunctionLogs).
      LoggingConfig:
        LogGroup: !Ref RecognitionDescribeFunctionLogs
      CodeUri: .
      Handler: presence.auth.DescribeHandler::handleRequest
      # The account's most (3008 MB): measured fastest of 1769 to 3008 MB
      # (8 crops warm in 2.4 s, 3.4 s at 2048), for some 6 % more a call
      # (specs/cloud-recognition.md, "Memory").
      MemorySize: 3008
      Timeout: 60
      Environment:
        Variables:
          RBACR_URL: !Ref RbacrUrl
          RBACR_TOKEN: !Ref RbacrToken
          RBACR_SYSTEM: !Ref RbacrSystem
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          MODEL_BUCKET: !Ref UserDataBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ProfileSubjectsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProfilesTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}/models/*"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
      Events:
        # Keeps an instance's model loaded (specs/cloud-recognition.md,
        # "Warm-up"): a new one takes over a minute, past the API's 30 s.
        # Prod only (WarmUp): elsewhere the rule exists but stays disabled.
        Warm:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Input: '{"rawPath": "/warmup"}'
            State: !If [WarmUp, ENABLED, DISABLED]
        Describe:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/recognition/describe
            Method: post

Outputs:
  # The tables' exports (<stack>-<Table>): presence_health imports them to
  # check the tables (DescribeTable). While it does, CloudFormation refuses
  # to change or remove them: scripts/deploy.sh deploys an existing health
  # stack first, so it stops importing one before this stack drops it, and
  # a new export ships in a deploy before the one that imports it.
  ApiDomain:
    Description: The HTTP API's host name (the site distribution's /api/* origin)
    Value: !Sub "${AuthHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ProfilesTableName:
    Description: Profiles (id -> createdAt, lastSignInAt)
    Value: !Ref ProfilesTable
    Export:
      Name: !Sub ${AWS::StackName}-ProfilesTable
  ProfileSubjectsTableName:
    Description: Which profile each subject signs in to (iss#sub -> profileId)
    Value: !Ref ProfileSubjectsTable
    Export:
      Name: !Sub ${AWS::StackName}-ProfileSubjectsTable
  LinkCodesTableName:
    Description: One-time link codes (sha256(code) -> profileId, expiresAt)
    Value: !Ref LinkCodesTable
    Export:
      Name: !Sub ${AWS::StackName}-LinkCodesTable
  RecognitionTableName:
    Description: Cloud recognition (profile, label#<id> or model -> embeddings, weights)
    Value: !Ref RecognitionTable
  SessionIssuer:
    Description: >
      The session tokens' issuer, which every Presence API's JWT authorizer
      (the payments API's: scripts/deploy.sh passes it) and rbacr trust
    Value: !If
      - HasSessionIssuer
      - !Ref SessionIssuer
      - !If [HasDomain, !Sub "https://${DomainName}", https://no-session-issuer.invalid]
  SessionsTableName:
    Description: Presence sessions' refresh tokens and families
    Value: !Ref SessionsTable
  IdentitiesTableName:
    Description: Provider identities' kept name and Apple refresh token
    Value: !Ref IdentitiesTable
