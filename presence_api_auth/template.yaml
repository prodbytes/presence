AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  presence_api_auth (stacks presence-auth-api and presence-rc-auth-api):
  GET /api/auth returns the signed-in user's profile (found by the token's
  subject, or made at the first sign-in) and roles; POST
  /api/auth/membership asks for access, POST /api/auth/voucher redeems a
  voucher code for its role, and the Admin routes (presence_admin) list and
  approve requests and create, list and delete vouchers; POST
  /api/auth/credentials and /api/auth/profile/* give a profile's cloud
  credentials and link its accounts. The HTTP API checks the Google ID token
  (JWT authorizer) before the functions run. GET /api/auth/anonymous, the
  only route without a token, returns the execution mode (DEV without
  GoogleWebClientId, else RBAC), the anonymous roles, and which settings are
  set. Roles: verified emails at AllowedDomains get presence_user and
  presence_admin, the UserRoles table adds more, and a linked account shares
  its profile owner's. Served under /api/* by the site's CloudFront
  distribution.

Parameters:
  GoogleWebClientId:
    Type: String
    Default: ''
    Description: >
      The Google web OAuth client; ID tokens must be issued for it (their aud).
      Empty only for local development (Floci): the API then runs in DEV mode,
      where the anonymous user gets every role. scripts/deploy.sh requires it.
    AllowedPattern: '([0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com)?'
  IdentityPoolId:
    Type: String
    Default: ''
    Description: >
      The Cognito identity pool cloud sync uses (presence-identity's
      IdentityPoolId). Only reported as set or not, for the app's health line.
  UserDataBucket:
    Type: String
    Default: ''
    Description: >
      The bucket cloud sync uploads to (presence-user-data's
      UserDataBucketName). Only reported as set or not, for the app's health line.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: >
      The Lambdas' CPU. arm64 in AWS; the local Floci deploy passes the
      host's, so they run without emulation (x86_64 on GitHub Codespaces).
  AllowedDomains:
    Type: String
    Default: nu01.com
    Description: Comma-separated email domains whose verified users get presence_user and presence_admin

Conditions:
  HasGoogleClient: !Not [!Equals [!Ref GoogleWebClientId, '']]
  HasIdentityPool: !Not [!Equals [!Ref IdentityPoolId, '']]
  HasUserDataBucket: !Not [!Equals [!Ref UserDataBucket, '']]

Globals:
  Function:
    Runtime: java25
    Architectures:
      - !Ref Architecture
    MemorySize: 512
    Timeout: 10

Resources:
  # Roles declared per user, by email: {"email": "<lowercase>", "roles": SS or L}.
  # Its contents live only here, never in the repository.
  UserRolesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Profiles: whose data it is, outliving the ways its owner signs in.
  # {"id": "<adjective>_<adjective>_<animal>", "createdAt", "lastSignInAt"
  # (epoch ms), "ownerSubject", "ownerEmail", "identityId" (its Cognito
  # identity: its folder in the user-data bucket)}.
  ProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Which profile each authenticated subject signs in to:
  # {"subject": "<iss>#<sub>", "profileId", "email", "linkedAt"}, indexed by
  # profile. Several subjects may share a profile (linked with a code).
  # Holds emails: AWS only.
  ProfileSubjectsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subject
          AttributeType: S
        - AttributeName: profileId
          AttributeType: S
      KeySchema:
        - AttributeName: subject
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: profile
          KeySchema:
            - AttributeName: profileId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Membership requests, one per user: {"email", "name", "message",
  # "requestedAt" (epoch ms), "dismissed"?}. Like UserRoles, it holds people's emails: AWS only.
  MembershipTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Voucher codes: {"code": "XXXX-XXXX-XXXX", "role", "expiresAt" (epoch ms),
  # "maxUses", "uses", "redeemedBy" (SS of emails), "createdBy", "createdAt"
  # (epoch ms)}. Holds emails and live codes: AWS only.
  VoucherTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # One-time link codes, by their SHA-256: {"code", "profileId",
  # "createdBy", "expiresAt" (epoch s, the TTL)}.
  LinkCodesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  AuthHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Anyone with a Google account can post membership requests: keep it slow.
      RouteSettings:
        "POST /api/auth/membership":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        # Slows down guessing codes (60 random bits each).
        "POST /api/auth/voucher":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        # Writes a profile at a first sign-in; the app asks it once per sign-in.
        "GET /api/auth":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        # Public (no token): the app asks it at every start.
        "GET /api/auth/anonymous":
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 20
        # Link codes: slow enough that guessing one (40 bits) is hopeless.
        "POST /api/auth/profile/link-code":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /api/auth/profile/link":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
      Auth:
        DefaultAuthorizer: GoogleIdToken
        Authorizers:
          # Rejects missing, expired, forged or foreign tokens with 401
          # before the function runs.
          GoogleIdToken:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: https://accounts.google.com
              # Without a client (DEV), no token can match: only the
              # anonymous route answers.
              audience:
                - !If [HasGoogleClient, !Ref GoogleWebClientId, no-oidc-client]

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.AuthHandler::handleRequest
      Environment:
        Variables:
          USER_ROLES_TABLE: !Ref UserRolesTable
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          ALLOWED_DOMAINS: !Ref AllowedDomains
          # Verified AllowedDomains users get both roles. Fixed here rather
          # than a parameter: stacks keep a parameter's old value when a
          # deploy doesn't pass it, which once left "admin" in place.
          DOMAIN_ROLES: presence_user,presence_admin
          # Decides the ExecutionMode: DEV when empty, else RBAC.
          GOOGLE_WEB_CLIENT_ID: !Ref GoogleWebClientId
          # GET /api/auth/anonymous says whether these are set (Settings).
          COGNITO_IDENTITY_POOL_ID: !Ref IdentityPoolId
          USER_DATA_BUCKET: !Ref UserDataBucket
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserRolesTable
        - Statement:
            # Finds the subject's profile, or links it to a new one.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ProfileSubjectsTable.Arn
            # Creates profiles (with an unused ID), records each sign-in
            # and reads the owner, whose roles a linked subject shares.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProfilesTable.Arn
      Events:
        Roles:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth
            Method: get
        # The execution mode and the anonymous user's roles, without a token.
        Anonymous:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/anonymous
            Method: get
            Auth:
              Authorizer: NONE

  MembershipFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.MembershipHandler::handleRequest
      Environment:
        Variables:
          MEMBERSHIP_TABLE: !Ref MembershipTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt MembershipTable.Arn
      Events:
        Request:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/membership
            Method: post

  VoucherFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.VoucherHandler::handleRequest
      Environment:
        Variables:
          VOUCHER_TABLE: !Ref VoucherTable
          USER_ROLES_TABLE: !Ref UserRolesTable
      Policies:
        - Statement:
            # Counts a use (one conditional update), or gives it back if the grant fails.
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt VoucherTable.Arn
            # Merges the voucher's role into the redeemer's roles.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UserRolesTable.Arn
      Events:
        Redeem:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/voucher
            Method: post

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.AdminHandler::handleRequest
      Environment:
        Variables:
          USER_ROLES_TABLE: !Ref UserRolesTable
          ALLOWED_DOMAINS: !Ref AllowedDomains
          DOMAIN_ROLES: presence_user,presence_admin
          MEMBERSHIP_TABLE: !Ref MembershipTable
          VOUCHER_TABLE: !Ref VoucherTable
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
      Policies:
        - Statement:
            # The caller's profile owner, whose roles a linked subject shares.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource:
                - !GetAtt ProfileSubjectsTable.Arn
                - !GetAtt ProfilesTable.Arn
            # Checks the caller's roles and grants presence_user.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt UserRolesTable.Arn
            # Lists, dismisses (a flag) and, after a grant, removes requests.
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !GetAtt MembershipTable.Arn
            # Creates (only new codes), lists and deletes vouchers.
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:Scan
                - dynamodb:DeleteItem
              Resource: !GetAtt VoucherTable.Arn
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/membership
            Method: get
        Grant:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/membership/grant
            Method: post
        Dismiss:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/membership/dismiss
            Method: post
        ListVouchers:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/vouchers
            Method: get
        CreateVoucher:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/vouchers
            Method: post
        DeleteVoucher:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/vouchers/delete
            Method: post

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: AuthFunction
      Handler: presence.auth.ProfileHandler::handleRequest
      Environment:
        Variables:
          USER_ROLES_TABLE: !Ref UserRolesTable
          ALLOWED_DOMAINS: !Ref AllowedDomains
          DOMAIN_ROLES: presence_user,presence_admin
          PROFILES_TABLE: !Ref ProfilesTable
          PROFILE_SUBJECTS_TABLE: !Ref ProfileSubjectsTable
          LINK_CODES_TABLE: !Ref LinkCodesTable
          COGNITO_IDENTITY_POOL_ID: !Ref IdentityPoolId
          USER_DATA_BUCKET: !Ref UserDataBucket
          # The identity pool's DeveloperProviderName (presence_infra/identity.yaml).
          DEVELOPER_PROVIDER: login.presence.profiles
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserRolesTable
        - Statement:
            # Links, moves and unlinks subjects; lists a profile's.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource:
                - !GetAtt ProfileSubjectsTable.Arn
                - !Sub "${ProfileSubjectsTable.Arn}/index/profile"
            # Makes profiles, records sign-ins, sets the identity once.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ProfilesTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt LinkCodesTable.Arn
            # Finds an account's existing identity (GetId) and issues the
            # profile's tokens. Only this pool ("none" when it isn't set).
            - Effect: Allow
              Action:
                - cognito-identity:GetId
                - cognito-identity:GetOpenIdTokenForDeveloperIdentity
              Resource: !Sub
                - "arn:${AWS::Partition}:cognito-identity:${AWS::Region}:${AWS::AccountId}:identitypool/${Pool}"
                - Pool: !If [HasIdentityPool, !Ref IdentityPoolId, none]
            # Only to see whether an account's folder is empty before linking it.
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${Bucket}"
                - Bucket: !If [HasUserDataBucket, !Ref UserDataBucket, none]
      Events:
        Credentials:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/credentials
            Method: post
        Profile:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile
            Method: get
        LinkCode:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/link-code
            Method: post
        Link:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/link
            Method: post
        Unlink:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthHttpApi
            Path: /api/auth/profile/unlink
            Method: post

Outputs:
  ApiDomain:
    Description: The HTTP API's host name (the site distribution's /api/* origin)
    Value: !Sub "${AuthHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserRolesTableName:
    Description: Where roles are declared per user (email -> roles)
    Value: !Ref UserRolesTable
  ProfilesTableName:
    Description: Profiles (id -> createdAt, lastSignInAt)
    Value: !Ref ProfilesTable
  ProfileSubjectsTableName:
    Description: Which profile each subject signs in to (iss#sub -> profileId)
    Value: !Ref ProfileSubjectsTable
  MembershipTableName:
    Description: Membership requests (email -> message, requestedAt)
    Value: !Ref MembershipTable
  VoucherTableName:
    Description: Voucher codes (code -> role, expiresAt, maxUses, uses)
    Value: !Ref VoucherTable
