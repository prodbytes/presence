version = 0.1

[default.global.parameters]
stack_name = "presence-auth-api"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
# No resolve_s3: SAM's shared aws-sam-cli-managed-default bucket would be
# writable by both stages. scripts/deploy.sh passes each stage's own bucket
# (--s3-bucket <prefix>-sam-artifacts-<account>, from
# presence_infra/github-deploy.yaml); a manual sam deploy needs
# --s3-bucket or --resolve-s3.
