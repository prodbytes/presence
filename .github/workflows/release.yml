# Builds the app binaries with `make` (web, Android, iOS, Linux) and
# publishes them as a GitHub release.
#
# - Tag pushes matching *QA or *RC* (e.g. 1.2.0-QA, 1.2.0-RC1) release that
#   tag as a prerelease.
# - Manual dispatch releases the chosen tag, creating it on the dispatched
#   commit if it doesn't exist yet.
# - Pull requests that change the build only build (no release), so a broken
#   build shows up before a tag does.
#
# The Google client IDs come from the repository variables
# GOOGLE_WEB_CLIENT_ID and GOOGLE_IOS_CLIENT_ID (public identifiers, not
# secrets: they're compiled into the app).
name: Release

on:
  push:
    tags:
      - "*QA"
      - "*RC*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created on this commit if missing). Empty uses the selected tag, or manual-<run number>.
        required: false
        type: string
      prerelease:
        description: Mark as a prerelease
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Makefile
      - scripts/make.sh
      - scripts/dart-defines.sh

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        name: Resolve the release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$EVENT" == pull_request ]]; then
            tag="pr-$PR_NUMBER"
          elif [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          else
            tag="manual-$RUN_NUMBER"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid tag '$tag': use letters, digits, '.', '_' and '-'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

  build:
    needs: prepare
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            os: ubuntu-latest
          - target: android
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: ios
            os: macos-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.target == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain
        run: flutter --version

      # Only the names scripts/dart-defines.sh forwards; never secrets.
      - name: Write .env
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          printf 'GOOGLE_WEB_CLIENT_ID=%s\nGOOGLE_IOS_CLIENT_ID=%s\n' \
            "$GOOGLE_WEB_CLIENT_ID" "$GOOGLE_IOS_CLIENT_ID" > .env

      - name: make ${{ matrix.target }}
        run: make "$TARGET"

      - name: Package
        run: |
          dist="$PWD/dist"
          mkdir -p "$dist"
          cd presence_app/build
          case "$TARGET" in
            web)
              (cd web && zip -qr "$dist/presence-$TAG-web.zip" .)
              ;;
            android)
              cp app/outputs/flutter-apk/app-release.apk "$dist/presence-$TAG-android.apk"
              ;;
            ios)
              ditto -c -k --keepParent ios/iphoneos/Runner.app "$dist/presence-$TAG-ios-unsigned.zip"
              ;;
            linux)
              bundle=(linux/*/release/bundle)
              arch="$(basename "$(dirname "$(dirname "${bundle[0]}")")")"
              tar -czf "$dist/presence-$TAG-linux-$arch.tar.gz" -C "$(dirname "${bundle[0]}")" bundle
              ;;
          esac
          ls -l "$dist"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presence-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: presence-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ github.event_name == 'push' || inputs.prerelease }}
        run: |
          ls -l dist
          title="presence-$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title"
          else
            flags=(--title "$title" --generate-notes --target "$GITHUB_SHA")
            [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
