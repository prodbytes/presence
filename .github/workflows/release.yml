# Builds the app binaries with `make` (web, Android, iOS, Linux, the
# Raspberry Pi camera kiosk .deb, and presence-streamer for 32- and 64-bit
# Raspberry Pis) and publishes them as a GitHub release.
#
# - Tag pushes matching *QA or *RC* (e.g. 1.2.0-QA, 1.2.0-RC1) release that
#   tag as a prerelease; *GA tags (e.g. 1.2.0-GA) as the latest full
#   release. scripts/release-rc.sh and scripts/release-ga.sh push them.
# - Manual dispatch releases the chosen tag, creating it on the dispatched
#   commit if it doesn't exist yet (an existing tag must name that commit).
#   Only a dispatch from main, of a commit on main, may publish a full
#   release; from any other ref it's always a prerelease, never "latest".
# - *GA and *RC* tags must name a commit on main (checked before building).
# - Pull requests that change the build only build (no release), so a broken
#   build shows up before a tag does.
#
# The Google client IDs come from the repository variables
# GOOGLE_WEB_CLIENT_ID and GOOGLE_IOS_CLIENT_ID (public identifiers, not
# secrets: they're compiled into the app). The streamer's Google device
# sign-in client comes from the GOOGLE_DEVICE_CLIENT_ID variable and the
# GOOGLE_DEVICE_CLIENT_SECRET secret (Google doesn't treat that kind of
# client's secret as confidential: it ships in the binary). Its live sync
# endpoint comes from the IOT_ENDPOINT variable (the account's AWS IoT
# iot:Data-ATS endpoint, public; one for prod and the RC).
#
# Store builds, when their secrets are set (never on pull requests; see
# specs/release.md for how to make each one):
# - Android: the upload key (ANDROID_UPLOAD_KEYSTORE_BASE64,
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD, optional ANDROID_UPLOAD_KEY_ALIAS and
#   ANDROID_UPLOAD_KEY_PASSWORD) signs the APK and an App Bundle (.aab) for
#   Google Play. Without it, the APK is debug-signed and there's no .aab.
# - iOS: the variable APPLE_TEAM_ID and the secrets
#   IOS_DISTRIBUTION_CERTIFICATE_BASE64, IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
#   and IOS_APPSTORE_PROFILE_BASE64 make an App Store .ipa instead of the
#   unsigned Runner.app; with APP_STORE_CONNECT_API_KEY_ID,
#   APP_STORE_CONNECT_API_ISSUER_ID and APP_STORE_CONNECT_API_KEY_BASE64, an
#   *RC* or *GA* tag's .ipa is also uploaded to App Store Connect (TestFlight).
name: Release

on:
  push:
    tags:
      - "*QA"
      - "*RC*"
      - "*GA"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (created on this commit if missing). Empty uses the selected tag, or manual-<run number>.
        required: false
        type: string
      prerelease:
        description: Mark as a prerelease
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Makefile
      - scripts/make.sh
      - scripts/deb.sh
      - packaging/**
      - presence_streamer/**
      - scripts/streamer.sh
      - scripts/models.sh
      - presence_ingest/**
      - scripts/dart-defines.sh
      - scripts/version.sh
      - presence_app/android/app/build.gradle.kts
      - presence_app/ios/Flutter/Release.xcconfig
      - version.X.txt
      - version.Y.txt

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.5"
  # The commit that tag names: the clone is checked against it.
  FLUTTER_COMMIT: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_z: ${{ steps.version.outputs.version_z }}
      build_number: ${{ steps.version.outputs.build_number }}
      prerelease: ${{ steps.trust.outputs.prerelease }}
    steps:
      # Full history, so the commit can be checked against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: tag
        name: Resolve the release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$EVENT" == pull_request ]]; then
            tag="pr-$PR_NUMBER"
          elif [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          else
            tag="manual-$RUN_NUMBER"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid tag '$tag': use letters, digits, '.', '_' and '-'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # Where the release may come from, and whether it's a prerelease:
      # - a pushed *GA or *RC* tag must name a commit on main; *GA is a
      #   full release, anything else a prerelease;
      # - a manual run publishes a full release only when asked, from main,
      #   of a commit on main; an existing tag must name the dispatched commit.
      - id: trust
        name: Check the release's commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          commit="$(git rev-parse HEAD)"
          on_main=false
          if git merge-base --is-ancestor "$commit" origin/main; then on_main=true; fi
          prerelease=true
          case "$EVENT" in
            pull_request) ;;
            push)
              if [[ "$TAG" == *GA || "$TAG" == *RC* ]] && [[ "$on_main" != true ]]; then
                echo "::error::$TAG ($commit) isn't on main; GA and RC releases are cut only from main"
                exit 1
              fi
              [[ "$TAG" == *GA ]] && prerelease=false
              ;;
            workflow_dispatch)
              if existing="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}")" && [[ "$existing" != "$commit" ]]; then
                echo "::error::Tag $TAG is $existing, not the dispatched commit $commit; dispatch from the tag instead"
                exit 1
              fi
              if [[ "$INPUT_PRERELEASE" == false ]]; then
                if [[ "$REF" == refs/heads/main || "$REF" == refs/tags/* ]] && [[ "$on_main" == true ]]; then
                  prerelease=false
                else
                  echo "::warning::$REF ($commit) isn't main: publishing $TAG as a prerelease"
                fi
              fi
              ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Commit $commit, on main: $on_main, prerelease: $prerelease"

      # One version for every platform's build. A tag that carries X.Y.Z
      # (e.g. 1.0.202609261530-RC) keeps its Z, and its X.Y must match the
      # version files; any other build gets Z from the current time.
      - id: version
        name: Resolve the version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-.*)?$ ]]; then
            export VERSION_Z="${BASH_REMATCH[3]}"
            tag_xy="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
          fi
          source scripts/version.sh
          if [[ -n "${tag_xy:-}" && "$tag_xy" != "$VERSION_X.$VERSION_Y" ]]; then
            echo "::error::Tag $TAG is version $tag_xy, but version.X.txt/version.Y.txt say $VERSION_X.$VERSION_Y"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "version_z=$VERSION_Z"
            echo "build_number=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (build $BUILD_NUMBER)"

  build:
    needs: prepare
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            name: web
            os: ubuntu-latest
          - target: android
            name: android
            os: ubuntu-latest
          # Flutter doesn't cross-compile Linux desktop, so each
          # architecture builds on a runner of that architecture. Ubuntu
          # 22.04 (GLib 2.72, glibc 2.35), not 24.04: the binary needs the
          # GLib it was built against, and Debian 12 / Raspberry Pi OS
          # Bookworm has 2.74, so a 24.04 build fails there with
          # "undefined symbol: g_once_init_enter_pointer".
          - target: linux
            name: linux-x64
            os: ubuntu-22.04
          # arm64 also packages the bundle as the Raspberry Pi camera
          # kiosk .deb (make deb builds the bundle, then packages it).
          - target: deb
            name: linux-arm64
            os: ubuntu-22.04-arm
          - target: ios
            name: ios
            os: macos-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
      VERSION_Z: ${{ needs.prepare.outputs.version_z }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.target == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux' || matrix.target == 'deb'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          got="$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)"
          if [[ "$got" != "$FLUTTER_COMMIT" ]]; then
            echo "::error::Flutter $FLUTTER_VERSION is $got, not the pinned $FLUTTER_COMMIT"
            exit 1
          fi
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain
        run: flutter --version

      # Only the names scripts/dart-defines.sh forwards; never secrets.
      - name: Write .env
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
        run: |
          printf 'GOOGLE_WEB_CLIENT_ID=%s\nGOOGLE_IOS_CLIENT_ID=%s\n' \
            "$GOOGLE_WEB_CLIENT_ID" "$GOOGLE_IOS_CLIENT_ID" > .env

      # Store signing (see specs/release.md). Pull requests never get the
      # keys: they build the APK (debug key) and the unsigned iOS app only.
      # The keys live in $RUNNER_TEMP and are removed after the build.

      # The Android upload key, decoded from its secret. Without it the APK
      # is signed with the runner's debug key and no App Bundle is built.
      - id: upload_key
        if: matrix.target == 'android' && github.event_name != 'pull_request'
        name: Set up the Android upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::notice::No ANDROID_UPLOAD_KEYSTORE_BASE64/ANDROID_UPLOAD_KEYSTORE_PASSWORD secrets: the APK is debug-signed and no App Bundle (.aab) is built"
            exit 0
          fi
          umask 077
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          base64 --decode > "$keystore" <<< "$KEYSTORE_BASE64"
          echo "keystore=$keystore" >> "$GITHUB_OUTPUT"

      - if: matrix.target == 'android' && github.event_name == 'pull_request'
        name: No App Bundle on pull requests
        run: echo "::notice::Pull requests get no signing secrets, so the App Bundle (.aab) isn't built"

      # The App Store distribution certificate (into a temporary keychain)
      # and provisioning profile, the Runner target's manual signing
      # (Flutter/Signing.xcconfig, included by Release.xcconfig) and the
      # ExportOptions.plist for `flutter build ipa`. Entitlements (e.g. Sign
      # in with Apple's) come from the project and must be in the profile.
      - id: ios_signing
        if: matrix.target == 'ios' && github.event_name != 'pull_request'
        name: Set up App Store signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: com.nu01.presence
        run: |
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$PROFILE_BASE64" || -z "$TEAM_ID" ]]; then
            echo "::notice::No App Store signing (APPLE_TEAM_ID, IOS_DISTRIBUTION_CERTIFICATE_BASE64/_PASSWORD, IOS_APPSTORE_PROFILE_BASE64): building the unsigned Runner.app"
            exit 0
          fi
          if [[ ! "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be the 10-character team ID"
            exit 1
          fi
          umask 077

          # The profile: for this team and app, App Store (no devices).
          profile="$RUNNER_TEMP/appstore.mobileprovision"
          base64 --decode > "$profile" <<< "$PROFILE_BASE64"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist"; }
          uuid="$(pb UUID)"
          profile_team="$(pb TeamIdentifier:0)"
          app_id="$(pb Entitlements:application-identifier)"
          if [[ ! "$uuid" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            echo "::error::The provisioning profile has no valid UUID"
            exit 1
          fi
          if [[ "$profile_team" != "$TEAM_ID" || "$app_id" != "$TEAM_ID.$BUNDLE_ID" ]]; then
            echo "::error::The provisioning profile is for $app_id (team $profile_team), not $TEAM_ID.$BUNDLE_ID"
            exit 1
          fi
          if pb ProvisionedDevices >/dev/null 2>&1; then
            echo "::error::The provisioning profile lists devices: it's a development or ad hoc profile, not an App Store one"
            exit 1
          fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done

          # The certificate, in a keychain of its own with a random password.
          keychain="$RUNNER_TEMP/presence-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          base64 --decode > "$RUNNER_TEMP/distribution.p12" <<< "$CERTIFICATE_BASE64"
          security import "$RUNNER_TEMP/distribution.p12" -k "$keychain" -f pkcs12 \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" >/dev/null
          keychains=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            keychains+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          security find-identity -v -p codesigning "$keychain"

          # The Runner target's signing, and how to export the .ipa.
          cat > presence_app/ios/Flutter/Signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $uuid
          EOF
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$uuid</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$export_options"
          {
            echo "export_options=$export_options"
            echo "keychain=$keychain"
          } >> "$GITHUB_OUTPUT"

      # With the upload key, the APK and the App Bundle are signed with it
      # (the passwords reach only the Android build, and only when the key
      # was set up); with App Store signing, iOS is the .ipa (make ipa).
      - name: make ${{ matrix.target }}
        env:
          IOS_EXPORT_OPTIONS: ${{ steps.ios_signing.outputs.export_options }}
          ANDROID_KEYSTORE_PATH: ${{ steps.upload_key.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.upload_key.outputs.keystore != '' && secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ steps.upload_key.outputs.keystore != '' && secrets.ANDROID_UPLOAD_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ steps.upload_key.outputs.keystore != '' && secrets.ANDROID_UPLOAD_KEY_PASSWORD || '' }}
        run: |
          if [[ "$TARGET" == ios && -n "$IOS_EXPORT_OPTIONS" ]]; then
            make ipa
          elif [[ "$TARGET" == android && -n "$ANDROID_KEYSTORE_PATH" ]]; then
            make android appbundle
          else
            make "$TARGET"
          fi

      - name: Package
        env:
          IOS_EXPORT_OPTIONS: ${{ steps.ios_signing.outputs.export_options }}
        run: |
          dist="$PWD/dist"
          mkdir -p "$dist"
          cd presence_app/build
          case "$TARGET" in
            web)
              (cd web && zip -qr "$dist/presence-$TAG-web.zip" .)
              ;;
            android)
              cp app/outputs/flutter-apk/app-release.apk "$dist/presence-$TAG-android.apk"
              if [[ -f app/outputs/bundle/release/app-release.aab ]]; then
                cp app/outputs/bundle/release/app-release.aab "$dist/presence-$TAG-android.aab"
                keytool -printcert -jarfile "$dist/presence-$TAG-android.aab" | grep -E 'Owner:|SHA256:'
              fi
              ;;
            ios)
              if [[ -n "$IOS_EXPORT_OPTIONS" ]]; then
                ipas=(ios/ipa/*.ipa)
                cp "${ipas[0]}" "$dist/presence-$TAG-ios.ipa"
              else
                ditto -c -k --keepParent ios/iphoneos/Runner.app "$dist/presence-$TAG-ios-unsigned.zip"
              fi
              ;;
            linux | deb)
              bundle=(linux/*/release/bundle)
              arch="$(basename "$(dirname "$(dirname "${bundle[0]}")")")"
              tar -czf "$dist/presence-$TAG-linux-$arch.tar.gz" -C "$(dirname "${bundle[0]}")" bundle
              if [[ "$TARGET" == deb ]]; then
                debs=(deb/presence_*_"$arch".deb)
                dpkg-deb --info "${debs[0]}"
                dpkg-deb --contents "${debs[0]}" | grep -v '/opt/presence/bundle/data/flutter_assets/'
                cp "${debs[0]}" "$dist/presence-$TAG-raspberrypi-$arch.deb"
              fi
              ;;
          esac
          ls -l "$dist"

      # TestFlight: an *RC* or *GA* tag's .ipa (both checked to be on main)
      # goes to App Store Connect when its API key is set; review and
      # release stay manual there.
      - if: steps.ios_signing.outputs.export_options != '' && github.event_name == 'push'
        name: Upload to App Store Connect
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [[ "$TAG" != *GA && "$TAG" != *RC* ]]; then
            echo "::notice::$TAG isn't an RC or GA tag: not uploading to App Store Connect"
            exit 0
          fi
          if [[ -z "$API_KEY_ID" || -z "$API_ISSUER_ID" || -z "$API_KEY_BASE64" ]]; then
            echo "::notice::No App Store Connect API key (APP_STORE_CONNECT_API_KEY_ID, _ISSUER_ID, _KEY_BASE64): the .ipa is only attached to the release"
            exit 0
          fi
          if [[ ! "$API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_ID must be the 10-character key ID"
            exit 1
          fi
          # altool looks for AuthKey_<id>.p8 in ~/.appstoreconnect/private_keys.
          umask 077
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          base64 --decode > "$keys/AuthKey_$API_KEY_ID.p8" <<< "$API_KEY_BASE64"
          # RC and GA tags pushed together can get the same build number (the
          # build time, in seconds) for the same version, so the second upload
          # is a duplicate of the first: that build is already there.
          set +e
          xcrun altool --upload-app --type ios --file "dist/presence-$TAG-ios.ipa" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            if grep -q 'ENTITY_ERROR.ATTRIBUTE.INVALID.DUPLICATE' "$RUNNER_TEMP/altool.log" &&
               grep -Eq "previousBundleVersion : $BUILD_NUMBER\$" "$RUNNER_TEMP/altool.log"; then
              echo "::notice::Build $BUILD_NUMBER is already in App Store Connect (another tag's run of the same build uploaded it): not uploading it again"
            else
              exit "$status"
            fi
          fi
          rm -f "$RUNNER_TEMP/altool.log"

      # Never leave a key on the runner, even after a failure.
      - if: always() && (matrix.target == 'android' || matrix.target == 'ios')
        name: Remove the signing keys
        env:
          KEYCHAIN: ${{ steps.ios_signing.outputs.keychain }}
        run: |
          rm -f "$RUNNER_TEMP/upload-keystore.jks" "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/appstore.mobileprovision" "$RUNNER_TEMP/profile.plist" \
            presence_app/ios/Flutter/Signing.xcconfig
          rm -rf "$HOME/.appstoreconnect/private_keys"
          if [[ -n "$KEYCHAIN" ]]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
          if [[ "$TARGET" == ios ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presence-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # presence-streamer for the Raspberry Pi, 32-bit (armhf, ARMv6: every
  # Pi) and 64-bit (arm64). Go cross-compiles, so one runner builds both.
  streamer:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION_Z: ${{ needs.prepare.outputs.version_z }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: presence_streamer/go.mod
          # No dependencies (no go.sum) to cache.
          cache: false

      - name: Test
        working-directory: presence_streamer
        run: go test ./...

      # The cloud detector (presence_ingest, deployed by the Deploy
      # workflows) decides what the small Pis' chunks become.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test the cloud detector
        working-directory: presence_ingest
        run: |
          python -m venv "$RUNNER_TEMP/ingest"
          # boto3 is the Lambda runtime's own, so it's not in requirements.txt.
          "$RUNNER_TEMP/ingest/bin/pip" install --quiet -r IngestFunction/requirements.txt pytest boto3
          "$RUNNER_TEMP/ingest/bin/python" -m pytest -q

      - name: make streamer
        env:
          GOOGLE_DEVICE_CLIENT_ID: ${{ vars.GOOGLE_DEVICE_CLIENT_ID }}
          GOOGLE_DEVICE_CLIENT_SECRET: ${{ secrets.GOOGLE_DEVICE_CLIENT_SECRET }}
          IOT_ENDPOINT: ${{ vars.IOT_ENDPOINT }}
        run: make streamer

      - name: Package
        run: |
          mkdir -p dist
          for arch in armhf arm64; do
            tars=(presence_streamer/build/presence-streamer_*_"$arch".tar.gz)
            debs=(presence_streamer/build/presence-streamer_*_"$arch".deb)
            dpkg-deb --info "${debs[0]}"
            cp "${tars[0]}" "dist/presence-streamer-$TAG-linux-$arch.tar.gz"
            cp "${debs[0]}" "dist/presence-streamer-$TAG-raspberrypi-$arch.deb"
          done
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: presence-streamer
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [prepare, build, streamer]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: presence-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          # Decided (and checked against main) in prepare.
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          ls -l dist
          title="presence-$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title"
          else
            flags=(--title "$title" --generate-notes --target "$GITHUB_SHA")
            if [[ "$PRERELEASE" == false ]]; then
              flags+=(--latest)
            else
              flags+=(--prerelease --latest=false)
            fi
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
