AWSTemplateFormatVersion: '2010-09-09'
Description: >
  presence-identity: a Cognito identity pool for profiles. The auth API
  (presence_api_auth, POST /api/auth/credentials) maps each Google account
  to its profile, one person whichever of their accounts signs in, and
  issues a developer-identity token for the profile's identity; the app
  trades it for temporary AWS credentials of the authenticated role, which
  may only read and write that identity's prefix in the user-data bucket
  (presence-user-data stack), and only when the token's tier principal tag
  is premium (rbacr says so), and use live sync: AWS IoT Core MQTT on that
  identity's own topics, presence/<Stage>/<identity ID>/*, through the
  LivePolicy IoT policy the auth API attaches to each identity. Guests
  (unauthenticated identities) aren't allowed.

Parameters:
  GoogleWebClientId:
    Type: String
    Description: >
      The Google "Web application" OAuth client ID. Every platform's ID token
      is issued for it (web directly; Android and iOS as their server client).
    AllowedPattern: '[0-9]+-[0-9a-z]+\.apps\.googleusercontent\.com'
  UserDataStackName:
    Type: String
    Default: presence-user-data
    Description: The user-data stack whose bucket this pool's users may use (presence-rc-user-data for RC)
  IdentityPoolName:
    Type: String
    Default: presence
    Description: presence for prod, presence-rc for RC
  Stage:
    Type: String
    Default: prod
    AllowedValues: [prod, rc]
    Description: >
      Live sync's topics are presence/<Stage>/<identity ID>/*: prod, or rc
      for the release candidate (the app's PRESENCE_STAGE).

Resources:
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Ref IdentityPoolName
      AllowUnauthenticatedIdentities: false
      AllowClassicFlow: false
      # The auth API's profiles (ProfileHandler); can't be changed once set.
      DeveloperProviderName: login.presence.profiles
      # Google stays: the auth API's GetId finds the identity an account
      # signed in to before profiles, so its data stays where it is.
      SupportedLoginProviders:
        accounts.google.com: !Ref GoogleWebClientId

  AuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      # Kept as first deployed: changing it needs iam:UpdateRoleDescription,
      # which the deploy roles don't have (it failed the 0.6 RC deploy).
      Description: Signed-in Presence users (Cognito identity pool, Google)
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            # TagSession: the auth API's developer-identity tokens carry a
            # tier principal tag (premium or free), which Cognito sets on
            # the session; the bucket's statements below require premium.
            Action:
              - sts:AssumeRoleWithWebIdentity
              - sts:TagSession
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: own-user-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Each profile reaches only <bucket>/<its identity ID>/..., whichever
              # of its Google accounts signed in; and only a premium one (the
              # tier tag the auth API gives the token, from rbacr). Free
              # profiles' devices sync over live sync alone. Credentials
              # without the tag (Google sign-in straight to the pool, which
              # the pool still accepts for GetId) reach nothing here.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub
                  - ${BucketArn}/${!cognito-identity.amazonaws.com:sub}/*
                  - BucketArn:
                      Fn::ImportValue: !Sub ${UserDataStackName}-bucket-arn
                Condition:
                  StringEquals:
                    aws:PrincipalTag/tier: premium
              - Effect: Allow
                Action: s3:ListBucket
                Resource:
                  Fn::ImportValue: !Sub ${UserDataStackName}-bucket-arn
                Condition:
                  StringEquals:
                    aws:PrincipalTag/tier: premium
                  StringLike:
                    s3:prefix:
                      - ${cognito-identity.amazonaws.com:sub}
                      - ${cognito-identity.amazonaws.com:sub}/*
        # Live sync (AWS IoT Core, MQTT over WebSockets). AWS IoT checks
        # this and LivePolicy, attached to the identity: both must allow.
        - PolicyName: own-live-sync
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Client IDs <identity ID>-<device ID>[-<session>] (live sync: with
              # the session part while always connected; without it, stable,
              # for scheduled connections' persistent sessions).
              - Effect: Allow
                Action: iot:Connect
                Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/${!cognito-identity.amazonaws.com:sub}-*
              # The profile's own topics: events (and, later, acks and
              # requests).
              - Effect: Allow
                Action:
                  - iot:Publish
                  - iot:Receive
                Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/presence/${Stage}/${!cognito-identity.amazonaws.com:sub}/*
              - Effect: Allow
                Action: iot:Subscribe
                Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/presence/${Stage}/${!cognito-identity.amazonaws.com:sub}/*

  # Live sync's IoT policy, attached to each profile's identity by the auth
  # API (POST /api/auth/credentials: iot:AttachPolicy): AWS IoT requires one
  # for authenticated Cognito identities, besides their role. The same
  # permissions as the role's own-live-sync, with the identity as a policy
  # variable.
  LivePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyName: !Sub ${IdentityPoolName}-live-sync
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:client/${!cognito-identity.amazonaws.com:sub}-*
          - Effect: Allow
            Action:
              - iot:Publish
              - iot:Receive
            Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topic/presence/${Stage}/${!cognito-identity.amazonaws.com:sub}/*
          - Effect: Allow
            Action: iot:Subscribe
            Resource: !Sub arn:${AWS::Partition}:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/presence/${Stage}/${!cognito-identity.amazonaws.com:sub}/*

  IdentityPoolRoles:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn

Outputs:
  IdentityPoolId:
    Description: The app's COGNITO_IDENTITY_POOL_ID
    Value: !Ref IdentityPool
  AuthenticatedRoleArn:
    Value: !GetAtt AuthenticatedRole.Arn
  LivePolicyName:
    Description: The auth API's IotPolicyName (live sync)
    Value: !Ref LivePolicy
