AWSTemplateFormatVersion: '2010-09-09'
Description: >
  presence-user-data: the bucket for users' data. The app syncs each signed-in
  user's clips (videos) and events here, straight from the device, under the
  user's Cognito identity ID (the subject of the identity pool in
  identity.yaml, whose authenticated role may read and write only that
  prefix): media under <identityId>/media/ (<clipId>.{webm,mp4,jpg}, tagged
  frames), and JSON only, partitioned by the UTC day of the year, under
  <identityId>/events/year=YYYY/day=DDD/ and <identityId>/clips/year=YYYY/day=DDD/
  (see specs/data-formats.md).

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: https://presence.nu01.com,https://local.presence.nu01.com:8443,http://localhost:8080
    Description: Web origins the app runs on (browser uploads need CORS)

Resources:
  UserDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # A re-upload or an app bug can't destroy a recording: old versions
      # stay for 30 days.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # S3 Intelligent-Tiering: objects move between the Frequent,
          # Infrequent (30 days unread) and Archive Instant Access (90 days)
          # tiers by themselves, all readable at once. The app uploads with
          # this storage class already; this catches anything else, old
          # versions too. The opt-in Archive/Deep Archive tiers stay off:
          # they need a restore before a read, which would break the app's
          # fetch after sign-in.
          - Id: intelligent-tiering
            Status: Enabled
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 0
            NoncurrentVersionTransitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 0
          # Users' data is kept for 3 months: 90 days after an object was
          # written (an event, clip or frame; re-uploading a changed one
          # restarts its count), it expires. The bucket is versioned, so
          # that hides it behind a delete marker, and expire-old-versions
          # below removes the data itself 30 days later (the window to undo
          # a mistake). Devices keep their own copies; the app doesn't
          # re-upload expired objects, since it remembers what it uploaded.
          - Id: expire-after-3-months
            Status: Enabled
            ExpirationInDays: 90
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          # Delete markers whose data is gone (after the two rules above).
          - Id: remove-expired-delete-markers
            Status: Enabled
            ExpiredObjectDeleteMarker: true
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref AllowedOrigins
            AllowedMethods: [GET, PUT, HEAD, DELETE]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3600

  UserDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UserDataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt UserDataBucket.Arn
              - !Sub ${UserDataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  UserDataBucketName:
    Description: The app's USER_DATA_BUCKET
    Value: !Ref UserDataBucket
    Export:
      # presence-user-data-bucket for prod, presence-rc-user-data-bucket for RC
      Name: !Sub ${AWS::StackName}-bucket
  UserDataBucketArn:
    Value: !GetAtt UserDataBucket.Arn
    Export:
      Name: !Sub ${AWS::StackName}-bucket-arn
